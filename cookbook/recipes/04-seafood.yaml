      - "اشوِه على الجلد في جريل ساخن ٤ دقائق، ثم اقلبه دقيقتين."
      - "اخلط الطماطم والبصل والبقدونس مع الزيت وباقي الليمون."
      - "قدّم السمك مع السلطة."
    tip: "الماكريل من أرخص الأسماك الغنية بأوميجا ٣ وفيتامين د."

