chapter:
  id: seafood
  title: "الأسماك والمأكولات البحرية"
  en: "Fish & Seafood"
  kind: main
  color: "#2b6aa8"
  intro: "صواني سمك بالفرن، سلمون، جمبري وتونة — بروتين خفيف وغني بالدهون المفيدة، وسريع التحضير."

recipes:
  - id: f01
    name: "صينية سمك بلطي بالخضار والبطاطس"
    en: "Baked Tilapia Tray with Vegetables"
    cuisine: "مصري"
    servings: 2
    time: 45
    photo:
      dish: "baked tilapia fillets on a bed of sliced potatoes, onion rings and green pepper, topped with tomato slices, roasted golden on top"
      vessel: "a black enamel baking tray"
      angle: "45-degree angle"
    ingredients:
      - [tilapia, 350, "فيليه بلطي"]
      - [potato, 250, "بطاطساية كبيرة شرائح رفيعة"]
      - [tomato, 200, "ثمرتين شرائح"]
      - [bell_pepper_green, 100, "فلفلة شرائح"]
      - [onion, 100, "بصلة حلقات"]
      - [garlic, 10, "٣ فصوص"]
      - [lemon_juice, 30, "عصير ليمونة"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [cumin, 2, "معلقة صغيرة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "تبّل السمك بالليمون والثوم والكمون والملح، واتركه ١٥ دقيقة."
      - "افرد البطاطس في صينية، ورش عليها نصف الزيت والملح، واخبزها في فرن ٢٠٠° لمدة ١٥ دقيقة."
      - "رص فوقها البصل والفلفل، ثم السمك، ثم شرائح الطماطم، ورش باقي الزيت و٥٠ مل ماء."
      - "غطِّ الصينية بورق ألومنيوم واخبزها ١٥ دقيقة، ثم اكشفها ١٠ دقائق حتى يتحمر الوش."
    tip: "خَبز البطاطس أولاً يضمن نضجها في نفس وقت السمك دون أن يجف."
    swap: "**للكيتو:** استبدل البطاطس بكوسة شرائح سميكة واختصر الخبز الأول إلى ٥ دقائق."

  - id: f02
    name: "سلمون بالليمون والشبت مع كينوا"
    en: "Lemon-Dill Salmon with Quinoa"
    cuisine: "عالمي"
    servings: 2
    time: 30
    photo:
      dish: "a baked salmon fillet with lemon slices and fresh dill on top, a mound of fluffy quinoa and roasted green asparagus spears"
      vessel: "a matte dark grey plate"
      angle: "45-degree angle"
    ingredients:
      - [salmon, 300, "قطعتين فيليه"]
      - [quinoa, 100, "نصف كوب (قبل الطهي)"]
      - [asparagus, 200, "حزمة هليون (أو فاصوليا خضراء)"]
      - [lemon_juice, 20, "عصير نصف ليمونة"]
      - [dill, 5, "معلقة كبيرة مفرومة"]
      - [garlic, 4, "فص"]
      - [olive_oil, 5, "معلقة صغيرة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "اغسل الكينوا جيداً، واطهها في ضعف حجمها ماء ١٥ دقيقة ثم اتركها مغطاة ٥ دقائق."
      - "ضع السلمون والهليون في صينية، ورش الزيت والثوم والملح."
      - "اخبزها في فرن ٢٠٠° لمدة ١٢–١٤ دقيقة حتى يتفتت السلمون بسهولة بالشوكة."
      - "رش الليمون والشبت فوق السلمون، وقدّمه مع الكينوا."
    tip: "السلمون من أغنى الأسماك بأحماض أوميجا ٣ — والسلمون المستزرع أعلى في السعرات من المصطاد، فلاحظ الوزن."
    swap: "**لسعرات أقل:** استخدم سمك فيليه أبيض بدل السلمون (حوالي −١٩٠ سعر للحصة)."

  - id: f03
    name: "جمبري بالثوم والليمون على شرائط الكوسة"
    en: "Garlic Shrimp with Zucchini Noodles"
    cuisine: "متوسطي"
    servings: 2
    time: 20
    photo:
      dish: "garlic lemon shrimp tossed with spiralized zucchini noodles, chopped parsley and thin green chili slices"
      vessel: "a shallow black ceramic pasta bowl"
      angle: "overhead top-down view"
    ingredients:
      - [shrimp, 350, "جمبري مقشر"]
      - [zucchini, 400, "٣ كوسايات كبيرة"]
      - [garlic, 15, "٥ فصوص شرائح"]
      - [butter, 10, "٢ معلقة صغيرة"]
      - [olive_oil, 5, "معلقة صغيرة"]
      - [lemon_juice, 15, "معلقة كبيرة"]
      - [parsley, 10, "حفنة صغيرة"]
      - [chili_green, 5, "قليل من الفلفل الحار"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "قطّع الكوسة شرائط رفيعة بالمقشرة أو السبيرالايزر، ورش عليها ملحاً واتركها ١٠ دقائق ثم جففها."
      - "سخّن الزيت والزبدة في طاسة واسعة، وقلّب الثوم والحار ٣٠ ثانية."
      - "أضف الجمبري واطهه ١–٢ دقيقة لكل جانب حتى يتحول للون الوردي فقط."
      - "أضف شرائط الكوسة والليمون وقلّب دقيقة واحدة، ثم رش البقدونس."
    tip: "الجمبري ينضج في دقائق — الزيادة تجعله مطاطياً. ارفعه بمجرد أن يأخذ شكل حرف C."
    swap: "**للرياضيين:** قدّمه مع ٧٠ جم مكرونة قمح كامل (قبل الطهي) للشخص (+٢٤٥ سعر)."

  - id: f04
    name: "سلطة التونة بالفاصوليا البيضاء"
    en: "Tuna & White Bean Salad"
    cuisine: "إيطالي"
    servings: 2
    time: 10
    photo:
      dish: "tuna and white bean salad with diced cucumber, tomato, thin red onion slices and parsley, glistening with olive oil and mustard dressing"
      vessel: "a wide dark stoneware salad bowl"
      angle: "45-degree angle"
    ingredients:
      - [tuna_water, 240, "علبتين مصفاتين"]
      - [white_beans_canned, 240, "علبة صغيرة مصفاة"]
      - [cucumber, 150, "خيارة كبيرة"]
      - [tomato, 150, "ثمرة كبيرة"]
      - [onion, 40, "ربع بصلة حمراء"]
      - [parsley, 15, "حفنة"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [lemon_juice, 20, "معلقة كبيرة ونصف"]
      - [mustard, 5, "معلقة صغيرة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "اشطف الفاصوليا تحت الماء وصفّها جيداً."
      - "قطّع الخيار والطماطم مكعبات، والبصل شرائح رفيعة جداً."
      - "اخفق الزيت والليمون والمستردة والملح."
      - "اخلط كل المكونات مع التونة المفتتة، وقلّبها برفق مع الصوص."
    tip: "وجبة غداء مثالية للعمل: تحفظ في علبة محكمة في الثلاجة حتى يومين — أضف الصوص قبل الأكل."
    swap: "**للكيتو:** استبدل الفاصوليا بأفوكادو (١٠٠ جم) وزيتون."

  - id: f05
    name: "سمك بوري مشوي بالليمون والكمون"
    en: "Oven-Grilled Mullet with Lemon & Cumin"
    cuisine: "مصري"
    servings: 2
    time: 35
    photo:
      dish: "two whole grilled mullet fish with crispy scored silver skin, rubbed with cumin and garlic, lemon slices and parsley, a small tomato and onion salad beside them"
      vessel: "a long black fish platter"
      angle: "45-degree angle"
    ingredients:
      - [mullet, 400, "سمكتين منظفتين (الجزء المأكول)"]
      - [lemon_juice, 30, "عصير ليمونة"]
      - [garlic, 10, "٣ فصوص"]
      - [cumin, 3, "معلقة صغيرة ونصف"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [tomato, 150, "للسلطة"]
      - [onion, 40, "للسلطة"]
      - [parsley, 10, "مفروم"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "اعمل شقوقاً مائلة في جانبي السمك."
      - "اخلط الليمون والثوم والكمون والزيت والملح، وادهن السمك من الداخل والخارج، واتركه ٢٠ دقيقة."
      - "اشوِه في الفرن على الشواية ٢٢٠° لمدة ٢٠–٢٥ دقيقة مع قلبه مرة حتى يتحمر الجلد."
      - "قطّع الطماطم والبصل والبقدونس سلطة، وقدّمها مع السمك."
    tip: "السمك ينضج عندما يتفتت اللحم بسهولة من الشوكة عند أسمك جزء."

  - id: f06
    name: "جمبري بالثوم والبابريكا مع رز بني"
    en: "Garlic Paprika Shrimp with Brown Rice"
    cuisine: "إسباني"
    servings: 2
    time: 35
    photo:
      dish: "sizzling garlic paprika shrimp glistening with olive oil and chopped parsley, served with a mound of brown rice and lemon wedges"
      vessel: "a shallow black terracotta cazuela dish"
      angle: "45-degree angle"
    ingredients:
      - [shrimp, 300, "جمبري مقشر"]
      - [rice_brown, 80, "ثلث كوب (قبل الطهي)"]
      - [garlic, 15, "٥ فصوص شرائح"]
      - [paprika, 4, "معلقتين صغيرتين"]
      - [chili_green, 5, "قليل من الحار"]
      - [olive_oil, 12, "معلقة كبيرة"]
      - [lemon_juice, 15, "معلقة كبيرة"]
      - [parsley, 10, "مفروم"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "اطهِ الرز البني حتى ينضج."
      - "سخّن الزيت على نار متوسطة، وأضف الثوم والحار حتى يصفرّ الثوم."
      - "أضف الجمبري والبابريكا والملح، وقلّب ٣–٤ دقائق حتى يتحول للون الوردي."
      - "أضف الليمون والبقدونس، وقدّمه مع الرز."
    tip: "أضف البابريكا مع الجمبري وليس قبله — البابريكا تحترق بسرعة وتصبح مُرّة."

  - id: f07
    name: "صيادية سمك صحية"
    en: "Lighter Egyptian Sayadeya"
    cuisine: "مصري"
    servings: 3
    time: 55
    photo:
      dish: "Egyptian sayadeya: brown caramelised-onion rice topped with golden baked white fish fillets, toasted almonds and parsley, lemon wedges"
      vessel: "a large round dark copper-tone serving dish"
      angle: "45-degree angle"
    ingredients:
      - [sea_bass, 400, "فيليه قاروص أو بلطي"]
      - [rice_white, 150, "ثلاثة أرباع كوب"]
      - [onion, 200, "٢ بصلة شرائح"]
      - [olive_oil, 15, "معلقة كبيرة"]
      - [tomato_paste, 15, "معلقة كبيرة"]
      - [cumin, 3, "معلقة صغيرة ونصف"]
      - [garlic, 6, "فصين"]
      - [lemon_juice, 20, "للتتبيل"]
      - [almonds, 10, "شرائح للتزيين"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "تبّل السمك بالليمون والثوم ونصف الكمون والملح."
      - "حمّر البصل في الزيت ببطء ١٥ دقيقة حتى يصبح بنياً غامقاً (هذا سر لون الصيادية)."
      - "أضف الصلصة وباقي الكمون والرز، وقلّب، ثم أضف ٣٧٥ مل ماء ساخن واتركه على نار هادئة ٢٠ دقيقة."
      - "اخبز السمك في فرن ٢٠٠° لمدة ١٥ دقيقة، وقدّمه فوق الرز مع اللوز."
    tip: "خبز السمك بدل قليه في الزيت يوفر حوالي ١٥٠ سعراً في الحصة."

  - id: f08
    name: "سلمون بصوص الجنزبيل مع بروكلي"
    en: "Ginger-Soy Salmon with Broccoli"
    cuisine: "آسيوي"
    servings: 2
    time: 25
    photo:
      dish: "two glazed salmon fillets with a shiny ginger-soy glaze, sesame seeds and sliced green onion, steamed bright green broccoli florets"
      vessel: "a rectangular black stoneware plate"
      angle: "45-degree angle"
    ingredients:
      - [salmon, 300, "قطعتين فيليه"]
      - [soy_sauce_light, 15, "معلقة كبيرة"]
      - [honey, 5, "معلقة صغيرة"]
      - [ginger, 6, "مبشور"]
      - [garlic, 4, "فص"]
      - [broccoli, 250, "زهرات"]
      - [sesame, 4, "للتزيين"]
      - [green_onion, 10, "عود"]
    steps:
      - "اخلط الصويا والعسل والجنزبيل والثوم، وتبّل السلمون ١٥ دقيقة."
      - "اخبز السلمون في فرن ٢٠٠° لمدة ١٢ دقيقة، وادهنه بباقي الصوص في المنتصف."
      - "اطهِ البروكلي بالبخار ٤ دقائق."
      - "قدّم السلمون فوق البروكلي، ورش السمسم والبصل الأخضر."
    tip: "حصة سلمون واحدة توفر احتياج يومين تقريباً من دهون أوميجا ٣."

  - id: f09
    name: "تاكو السمك بصوص الزبادي"
    en: "Fish Tacos with Yogurt Slaw"
    cuisine: "مكسيكي"
    servings: 2
    time: 25
    photo:
      dish: "four soft whole-wheat tortilla tacos filled with flaky paprika-spiced white fish, crunchy purple cabbage slaw, avocado slices, a drizzle of white yogurt sauce, coriander and lime"
      vessel: "a black metal taco holder on a dark board"
      angle: "45-degree angle"
    ingredients:
      - [cod, 300, "فيليه سمك أبيض"]
      - [tortilla_whole, 90, "٢ رغيف (أو ٤ صغيرة)"]
      - [cabbage_red, 100, "مقطع رفيع"]
      - [greek_yogurt_0, 60, "للصوص"]
      - [lemon_juice, 20, "معلقة كبيرة ونصف"]
      - [avocado, 50, "شرائح"]
      - [cilantro, 10, "كزبرة"]
      - [paprika, 2, "معلقة صغيرة"]
      - [cumin, 1, "رشة"]
      - [olive_oil, 5, "معلقة صغيرة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "تبّل السمك بالبابريكا والكمون والزيت والملح، واشوِه ٣ دقائق لكل جانب، ثم فتّته."
      - "اخلط الزبادي مع نصف الليمون والملح، وقلّب الكرنب مع نصف الصوص."
      - "سخّن التورتيلا، وضع الكرنب ثم السمك والأفوكادو."
      - "رش باقي الصوص والكزبرة والليمون."
    tip: "الكرنب الأحمر يضيف قرمشة ولوناً ومضادات أكسدة بسعرات قليلة جداً."

  - id: f10
    name: "شوربة السمك والجمبري بالطماطم"
    en: "Tomato Seafood Soup"
    cuisine: "متوسطي"
    servings: 3
    time: 35
    photo:
      dish: "a rustic tomato seafood soup with chunks of white fish and pink shrimp, diced carrot and celery, chopped parsley, a drizzle of olive oil"
      vessel: "a wide dark stoneware soup bowl"
      angle: "45-degree angle"
    ingredients:
      - [cod, 200, "مكعبات سمك أبيض"]
      - [shrimp, 150, "جمبري مقشر"]
      - [tomato_canned, 400, "علبة"]
      - [onion, 80, "بصلة صغيرة"]
      - [carrot, 80, "جزرة"]
      - [celery, 60, "عود كرفس"]
      - [garlic, 10, "٣ فصوص"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [parsley, 10, "للتزيين"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "شوّح البصل والجزر والكرفس في الزيت ٦ دقائق، ثم الثوم."
      - "أضف الطماطم و٧٠٠ مل ماء والملح، واتركها تغلي ١٥ دقيقة."
      - "أضف السمك، وبعد ٣ دقائق أضف الجمبري، واتركها دقيقتين حتى ينضجا."
      - "قدّمها بالبقدونس."
    tip: "أضف المأكولات البحرية في آخر الطهي فقط — حتى تبقى طرية."

  - id: f11
    name: "قاروص بالليمون مع قرنبيط مهروس (كيتو)"
    en: "Keto Lemon Sea Bass with Cauliflower Mash"
    cuisine: "متوسطي"
    servings: 2
    time: 30
    photo:
      dish: "two pan-seared sea bass fillets with crispy golden skin over creamy white cauliflower mash, lemon slices and parsley"
      vessel: "a wide matte grey-black plate"
      angle: "45-degree angle"
    ingredients:
      - [sea_bass, 300, "فيليه"]
      - [cauliflower, 400, "رأس صغير"]
      - [butter, 10, "معلقتين صغيرتين"]
      - [milk_1, 50, "ربع كوب"]
      - [garlic, 5, "فص"]
      - [lemon_juice, 15, "معلقة كبيرة"]
      - [olive_oil, 5, "معلقة صغيرة"]
      - [parsley, 5, "للتزيين"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "اسلق القرنبيط مع الثوم ١٢ دقيقة حتى يطرى، وصفّه جيداً."
      - "اهرسه أو اضربه بالخلاط مع الزبدة واللبن والملح حتى يصبح ناعماً."
      - "جفف السمك، وضعه على الجلد في طاسة ساخنة بالزيت ٤ دقائق حتى يقرمش، ثم اقلبه دقيقة."
      - "قدّمه فوق القرنبيط مع الليمون والبقدونس."
    tip: "القرنبيط المهروس بديل كيتو للبطاطس المهروسة بربع السعرات تقريباً."

