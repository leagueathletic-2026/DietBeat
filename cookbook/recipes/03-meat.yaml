chapter:
  id: meat
  title: "اللحوم"
  en: "Beef & Lamb"
  kind: main
  color: "#a8423c"
  intro: "كفتة وحواوشي وطواجن مصرية بلحم صافٍ قليل الدهون — نفس الطعم الذي تحبه بسعرات أذكى."

recipes:
  - id: m01
    name: "كفتة مشوية بالبقدونس مع سلطة طحينة"
    en: "Grilled Kofta with Tahini Salad"
    cuisine: "مصري"
    servings: 2
    time: 30
    ingredients:
      - [beef_lean_ground, 300, "لحمة مفرومة ٥٪ دهون"]
      - [onion, 60, "نصف بصلة مبشورة ومصفاة"]
      - [parsley, 15, "حفنة مفرومة ناعم"]
      - [garlic, 5, "فص"]
      - [cumin, 1, "نصف معلقة صغيرة"]
      - [black_pepper, 1, "رشة"]
      - [tahini, 20, "معلقة كبيرة ونصف"]
      - [lemon_juice, 20, "معلقة كبيرة ونصف"]
      - [tomato, 150, "ثمرة كبيرة"]
      - [cucumber, 150, "خيارة كبيرة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "اعصر البصل المبشور جيداً من مائه، واخلطه مع اللحمة والبقدونس والثوم والكمون والفلفل والملح، واعجن دقيقتين."
      - "شكّل الخليط أصابع على أسياخ أو بيدك، وضعها في الثلاجة ١٥ دقيقة لتتماسك."
      - "اشوِها في جريل أو فرن على أعلى حرارة ٤–٥ دقائق لكل جانب."
      - "اخفق الطحينة مع الليمون والملح وماء بارد تدريجياً حتى يصبح القوام كريمياً."
      - "قطّع الطماطم والخيار مكعبات، وقدّمها مع الكفتة ورش صوص الطحينة."
    tip: "اللحمة قليلة الدهون تحتاج بصل وبقدونس أكثر لتبقى طرية — ولا تُطِل شويها."
    swap: "**لوجبة أكبر:** أضف رغيف عيش أسمر صغير (٦٠ جم، +١٦٠ سعر)."

  - id: m02
    name: "حواوشي صحي بالعيش الأسمر"
    en: "Lighter Egyptian Hawawshi"
    cuisine: "مصري"
    servings: 2
    time: 35
    ingredients:
      - [beef_lean_ground, 200, "لحمة مفرومة ٥٪ دهون"]
      - [pita_whole, 120, "رغيفين بلدي أسمر صغار"]
      - [onion, 60, "نصف بصلة مفرومة ناعم"]
      - [bell_pepper_green, 60, "نصف فلفلة مفرومة"]
      - [chili_green, 10, "فلفلة حارة صغيرة (اختياري)"]
      - [parsley, 10, "حفنة صغيرة"]
      - [tomato, 50, "نصف ثمرة مفرومة ومصفاة"]
      - [olive_oil, 5, "معلقة صغيرة لدهن العيش"]
      - [cumin, 1, "نصف معلقة صغيرة"]
      - [black_pepper, 1, "رشة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "سخّن الفرن على ٢٢٠°."
      - "اخلط اللحمة مع البصل والفلفل والحار والبقدونس والطماطم والبهارات جيداً."
      - "افتح كل رغيف من الجنب، ووزّع الحشوة بطبقة رفيعة متساوية حتى الأطراف."
      - "ادهن وجه العيش بالزيت بفرشاة، ورصّه على صينية."
      - "اخبزه ١٥–١٨ دقيقة مع قلبه في المنتصف حتى يتحمر العيش وتنضج اللحمة."
    tip: "الطبقة الرفيعة من الحشوة هي سر النضج المتساوي والعيش المقرمش."
    swap: "**لسعرات أقل:** قدّمه مع سلطة خضراء كبيرة بدلاً من البطاطس أو المخلل."

  - id: m03
    name: "ستيك لحمة مع بطاطا مشوية وفاصوليا خضراء"
    en: "Steak with Roasted Sweet Potato"
    cuisine: "عالمي"
    servings: 2
    time: 40
    ingredients:
      - [beef_lean, 300, "قطعتين ستيك (توب راوند)"]
      - [sweet_potato, 300, "بطاطاية كبيرة"]
      - [green_beans, 200, "فاصوليا خضراء"]
      - [olive_oil, 12, "معلقة كبيرة"]
      - [garlic, 6, "فصين"]
      - [paprika, 1, "رشة"]
      - [black_pepper, 1, "رشة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "قطّع البطاطا مكعبات، وقلّبها مع نصف الزيت والبابريكا والملح، واشوِها في فرن ٢٢٠° لمدة ٢٥–٣٠ دقيقة."
      - "اسلق الفاصوليا ٤ دقائق في ماء مغلي بالملح، ثم ضعها في ماء مثلج."
      - "جفف الستيك بمناديل، وتبّله بالملح والفلفل، وادهنه بقليل من الزيت."
      - "سخّن طاسة حديد حتى تدخّن، واطهِ الستيك ٣–٤ دقائق لكل جانب (حسب السمك والاستواء المطلوب)، ثم اتركه يرتاح ٥ دقائق."
      - "شوّح الفاصوليا مع الثوم وباقي الزيت دقيقتين، وقدّمها مع البطاطا والستيك."
    tip: "اترك الستيك يرتاح قبل التقطيع، واقطعه عكس اتجاه الألياف ليكون أطرى."
    swap: "**للكيتو:** استبدل البطاطا بـ ٣٠٠ جم بروكلي أو قرنبيط مشوي."

  - id: m04
    name: "بامية باللحمة الصافية"
    en: "Egyptian Okra & Beef Stew"
    cuisine: "مصري"
    servings: 4
    time: 75
    ingredients:
      - [beef_lean, 400, "مكعبات لحمة صافية"]
      - [okra, 500, "بامية صغيرة (طازجة أو مجمدة)"]
      - [tomato_canned, 400, "علبة طماطم مقطعة"]
      - [tomato_paste, 30, "٢ معلقة كبيرة"]
      - [onion, 100, "بصلة متوسطة"]
      - [garlic, 15, "٥ فصوص"]
      - [cilantro, 15, "حفنة كزبرة خضراء"]
      - [olive_oil, 15, "معلقة كبيرة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "شوّح البصل في ثلثي الزيت حتى يذبل، ثم أضف اللحمة وقلّبها حتى يتغير لونها."
      - "أضف ٥٠٠ مل ماء ساخن، وغطِّ الحلة، واتركها على نار هادئة ٤٥ دقيقة حتى تطرى اللحمة."
      - "أضف الطماطم والصلصة والبامية والملح، واتركها ٢٠ دقيقة."
      - "اهرس الثوم مع الكزبرة وشوّحهما في باقي الزيت في طاسة صغيرة نصف دقيقة (التقلية)، وأضفهما للحلة قبل إطفاء النار بدقيقتين."
    tip: "التقلية بالثوم والكزبرة هي روح البامية المصرية — حتى بكمية زيت قليلة."
    swap: "**لوجبة كاملة:** قدّمها مع ٥٠ جم رز أبيض (قبل الطهي) للشخص (+١٨٠ سعر)."
