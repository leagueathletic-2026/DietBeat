chapter:
  id: meat
  title: "اللحوم"
  en: "Beef & Lamb"
  kind: main
  color: "#a8423c"
  intro: "كفتة وحواوشي وطواجن مصرية بلحم صافٍ قليل الدهون — نفس الطعم الذي تحبه بسعرات أذكى."

recipes:
  - id: m01
    name: "كفتة مشوية بالبقدونس مع سلطة طحينة"
    en: "Grilled Kofta with Tahini Salad"
    cuisine: "مصري"
    servings: 2
    time: 30
    photo:
      dish: "six grilled Egyptian beef kofta fingers flecked with parsley, a small bowl of tahini sauce, diced tomato and cucumber salad, lemon wedges"
      vessel: "a matte black stoneware platter"
      angle: "45-degree angle"
    ingredients:
      - [beef_lean_ground, 300, "لحمة مفرومة ٥٪ دهون"]
      - [onion, 60, "نصف بصلة مبشورة ومصفاة"]
      - [parsley, 15, "حفنة مفرومة ناعم"]
      - [garlic, 5, "فص"]
      - [cumin, 1, "نصف معلقة صغيرة"]
      - [black_pepper, 1, "رشة"]
      - [tahini, 20, "معلقة كبيرة ونصف"]
      - [lemon_juice, 20, "معلقة كبيرة ونصف"]
      - [tomato, 150, "ثمرة كبيرة"]
      - [cucumber, 150, "خيارة كبيرة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "اعصر البصل المبشور جيداً من مائه، واخلطه مع اللحمة والبقدونس والثوم والكمون والفلفل والملح، واعجن دقيقتين."
      - "شكّل الخليط أصابع على أسياخ أو بيدك، وضعها في الثلاجة ١٥ دقيقة لتتماسك."
      - "اشوِها في جريل أو فرن على أعلى حرارة ٤–٥ دقائق لكل جانب."
      - "اخفق الطحينة مع الليمون والملح وماء بارد تدريجياً حتى يصبح القوام كريمياً."
      - "قطّع الطماطم والخيار مكعبات، وقدّمها مع الكفتة ورش صوص الطحينة."
    tip: "اللحمة قليلة الدهون تحتاج بصل وبقدونس أكثر لتبقى طرية — ولا تُطِل شويها."
    swap: "**لوجبة أكبر:** أضف رغيف عيش أسمر صغير (٦٠ جم، +١٦٠ سعر)."

  - id: m02
    name: "حواوشي صحي بالعيش الأسمر"
    en: "Lighter Egyptian Hawawshi"
    cuisine: "مصري"
    servings: 2
    time: 35
    photo:
      dish: "Egyptian hawawshi: crispy baked whole-wheat baladi bread halves stuffed with spiced minced beef, onion and green pepper, cut to show the filling"
      vessel: "a dark wooden board"
      angle: "45-degree angle"
    ingredients:
      - [beef_lean_ground, 200, "لحمة مفرومة ٥٪ دهون"]
      - [pita_whole, 120, "رغيفين بلدي أسمر صغار"]
      - [onion, 60, "نصف بصلة مفرومة ناعم"]
      - [bell_pepper_green, 60, "نصف فلفلة مفرومة"]
      - [chili_green, 10, "فلفلة حارة صغيرة (اختياري)"]
      - [parsley, 10, "حفنة صغيرة"]
      - [tomato, 50, "نصف ثمرة مفرومة ومصفاة"]
      - [olive_oil, 5, "معلقة صغيرة لدهن العيش"]
      - [cumin, 1, "نصف معلقة صغيرة"]
      - [black_pepper, 1, "رشة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "سخّن الفرن على ٢٢٠°."
      - "اخلط اللحمة مع البصل والفلفل والحار والبقدونس والطماطم والبهارات جيداً."
      - "افتح كل رغيف من الجنب، ووزّع الحشوة بطبقة رفيعة متساوية حتى الأطراف."
      - "ادهن وجه العيش بالزيت بفرشاة، ورصّه على صينية."
      - "اخبزه ١٥–١٨ دقيقة مع قلبه في المنتصف حتى يتحمر العيش وتنضج اللحمة."
    tip: "الطبقة الرفيعة من الحشوة هي سر النضج المتساوي والعيش المقرمش."
    swap: "**لسعرات أقل:** قدّمه مع سلطة خضراء كبيرة بدلاً من البطاطس أو المخلل."

  - id: m03
    name: "ستيك لحمة مع بطاطا مشوية وفاصوليا خضراء"
    en: "Steak with Roasted Sweet Potato"
    cuisine: "عالمي"
    servings: 2
    time: 40
    photo:
      dish: "sliced medium-rare lean beef steak, roasted sweet potato cubes and garlicky green beans"
      vessel: "a black slate plate"
      angle: "45-degree angle"
    ingredients:
      - [beef_lean, 300, "قطعتين ستيك (توب راوند)"]
      - [sweet_potato, 300, "بطاطاية كبيرة"]
      - [green_beans, 200, "فاصوليا خضراء"]
      - [olive_oil, 12, "معلقة كبيرة"]
      - [garlic, 6, "فصين"]
      - [paprika, 1, "رشة"]
      - [black_pepper, 1, "رشة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "قطّع البطاطا مكعبات، وقلّبها مع نصف الزيت والبابريكا والملح، واشوِها في فرن ٢٢٠° لمدة ٢٥–٣٠ دقيقة."
      - "اسلق الفاصوليا ٤ دقائق في ماء مغلي بالملح، ثم ضعها في ماء مثلج."
      - "جفف الستيك بمناديل، وتبّله بالملح والفلفل، وادهنه بقليل من الزيت."
      - "سخّن طاسة حديد حتى تدخّن، واطهِ الستيك ٣–٤ دقائق لكل جانب (حسب السمك والاستواء المطلوب)، ثم اتركه يرتاح ٥ دقائق."
      - "شوّح الفاصوليا مع الثوم وباقي الزيت دقيقتين، وقدّمها مع البطاطا والستيك."
    tip: "اترك الستيك يرتاح قبل التقطيع، واقطعه عكس اتجاه الألياف ليكون أطرى."
    swap: "**للكيتو:** استبدل البطاطا بـ ٣٠٠ جم بروكلي أو قرنبيط مشوي."

  - id: m04
    name: "بامية باللحمة الصافية"
    en: "Egyptian Okra & Beef Stew"
    cuisine: "مصري"
    servings: 4
    time: 75
    photo:
      dish: "Egyptian okra and beef stew: tender beef chunks and small whole okra pods in a rich red tomato sauce, garnished with chopped coriander"
      vessel: "a dark clay tagine-style pot"
      angle: "overhead top-down view"
    ingredients:
      - [beef_lean, 400, "مكعبات لحمة صافية"]
      - [okra, 500, "بامية صغيرة (طازجة أو مجمدة)"]
      - [tomato_canned, 400, "علبة طماطم مقطعة"]
      - [tomato_paste, 30, "٢ معلقة كبيرة"]
      - [onion, 100, "بصلة متوسطة"]
      - [garlic, 15, "٥ فصوص"]
      - [cilantro, 15, "حفنة كزبرة خضراء"]
      - [olive_oil, 15, "معلقة كبيرة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "شوّح البصل في ثلثي الزيت حتى يذبل، ثم أضف اللحمة وقلّبها حتى يتغير لونها."
      - "أضف ٥٠٠ مل ماء ساخن، وغطِّ الحلة، واتركها على نار هادئة ٤٥ دقيقة حتى تطرى اللحمة."
      - "أضف الطماطم والصلصة والبامية والملح، واتركها ٢٠ دقيقة."
      - "اهرس الثوم مع الكزبرة وشوّحهما في باقي الزيت في طاسة صغيرة نصف دقيقة (التقلية)، وأضفهما للحلة قبل إطفاء النار بدقيقتين."
    tip: "التقلية بالثوم والكزبرة هي روح البامية المصرية — حتى بكمية زيت قليلة."
    swap: "**لوجبة كاملة:** قدّمها مع ٥٠ جم رز أبيض (قبل الطهي) للشخص (+١٨٠ سعر)."

  - id: m05
    name: "كباب حلة بالبصل"
    en: "Egyptian Kebab Halla"
    cuisine: "مصري"
    servings: 4
    time: 90
    photo:
      dish: "Egyptian kebab halla: tender braised lean beef cubes in a glossy caramelised golden-brown onion sauce, black pepper"
      vessel: "a heavy dark copper-bottomed pot"
      angle: "45-degree angle"
    ingredients:
      - [beef_lean, 500, "مكعبات لحمة صافية"]
      - [onion, 400, "٤ بصلات حلقات"]
      - [garlic, 10, "٣ فصوص"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [tomato_paste, 10, "٢ معلقة صغيرة (اختياري)"]
      - [black_pepper, 2, "معلقة صغيرة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "حمّر اللحمة في الزيت على نار عالية حتى يتغير لونها من كل الجهات."
      - "أضف البصل والثوم، وقلّب ١٠ دقائق حتى يذبل البصل ويخرج ماءه."
      - "أضف الفلفل الأسود والملح والصلصة وكوب ماء ساخن، وغطِّ الحلة على نار هادئة ساعة إلى ساعة وربع."
      - "اكشف الحلة في آخر ١٠ دقائق حتى يتكثف الصوص ويصبح بنياً لامعاً."
    tip: "البصل الكثير هو الصوص — لا يحتاج الكباب لسمن أو دقيق ليتكثف."
    swap: "**لوجبة كاملة:** قدّمه مع ١٥٠ جم بطاطس مشوية للحصة (+١١٥ سعر)."

  - id: m06
    name: "لحمة مقلّبة بالفلفل الألوان (كيتو)"
    en: "Keto Pepper Beef Stir-Fry"
    cuisine: "آسيوي"
    servings: 2
    time: 20
    photo:
      dish: "thin strips of seared lean beef stir-fried with red and green bell pepper strips and onion in a glossy ginger-soy sauce, sesame seeds"
      vessel: "a dark carbon-steel wok"
      angle: "45-degree angle"
    ingredients:
      - [beef_lean, 350, "شرائح رفيعة"]
      - [bell_pepper_red, 125, "ثمرة"]
      - [bell_pepper_green, 125, "ثمرة"]
      - [onion, 40, "نصف بصلة صغيرة"]
      - [garlic, 6, "فصين"]
      - [ginger, 5, "مبشور"]
      - [soy_sauce_light, 20, "معلقة كبيرة ونصف"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [sesame, 4, "للتزيين"]
    steps:
      - "قطّع اللحمة شرائح رفيعة جداً عكس الألياف (التجميد ٣٠ دقيقة يسهّل التقطيع)."
      - "سخّن نصف الزيت على نار عالية جداً، وحمّر اللحمة دقيقتين فقط ثم ارفعها."
      - "أضف باقي الزيت والثوم والجنزبيل والخضار، وقلّب ٣ دقائق."
      - "أرجع اللحمة، وأضف الصويا صوص، وقلّب دقيقة، ورش السمسم."
    tip: "اللحمة الصافية تطهى بسرعة — الطهي الزائد يجعلها مطاطية."

  - id: m07
    name: "كفتة داود باشا بالصلصة"
    en: "Daoud Basha Meatballs"
    cuisine: "مصري"
    servings: 4
    time: 45
    photo:
      dish: "Daoud Basha: round beef meatballs simmered in a thick red tomato sauce with onion, sprinkled with chopped parsley"
      vessel: "a wide black enamel braiser"
      angle: "overhead top-down view"
    ingredients:
      - [beef_lean_ground, 400, "لحمة مفرومة ٥٪"]
      - [onion, 130, "٥٠ للكفتة و٨٠ للصلصة"]
      - [parsley, 15, "مفروم"]
      - [garlic, 10, "٣ فصوص"]
      - [cumin, 2, "معلقة صغيرة"]
      - [tomato_canned, 400, "علبة"]
      - [tomato_paste, 20, "معلقة كبيرة"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "اخلط اللحمة مع ٥٠ جم بصل مبشور ومعصور والبقدونس ونصف الثوم والكمون والملح، وشكّل ٢٠ كرة."
      - "حمّر الكرات في الفرن ٢٢٠° لمدة ١٠ دقائق بدلاً من القلي."
      - "شوّح باقي البصل والثوم في الزيت، وأضف الطماطم والصلصة ونصف كوب ماء، واتركها ١٠ دقائق."
      - "أضف الكفتة للصلصة، واتركها تتسبك ١٥ دقيقة على نار هادئة."
    tip: "تحمير الكفتة في الفرن يوفر الزيت ويحافظ على شكلها في الصلصة."
    swap: "**لوجبة كاملة:** قدّمها مع ٥٠ جم رز أبيض (قبل الطهي) للشخص (+١٨٠ سعر)."

  - id: m08
    name: "طاجن لحمة بالخضار في الفرن"
    en: "Oven Beef & Vegetable Stew"
    cuisine: "مصري"
    servings: 4
    time: 100
    photo:
      dish: "a rustic beef and vegetable stew with tender beef chunks, potato cubes, carrot rounds and green peas in a rich tomato sauce, steaming"
      vessel: "a traditional dark clay pot (tagen)"
      angle: "45-degree angle"
    ingredients:
      - [beef_lean, 500, "مكعبات"]
      - [potato, 300, "٢ بطاطس مكعبات"]
      - [carrot, 200, "٢ جزرة"]
      - [peas, 150, "بسلة"]
      - [onion, 100, "بصلة"]
      - [tomato_canned, 400, "علبة"]
      - [garlic, 10, "٣ فصوص"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "حمّر اللحمة في الزيت، ثم أضف البصل والثوم."
      - "أضف الطماطم و٥٠٠ مل ماء، واتركها ٤٥ دقيقة على نار هادئة."
      - "انقلها إلى طاجن فخار، وأضف البطاطس والجزر والبسلة والملح."
      - "اخبزه في فرن ١٨٠° لمدة ٤٠ دقيقة حتى تنضج الخضار ويتحمر الوش."
    tip: "الفخار يحتفظ بالحرارة ويعطي الطاجن طعماً مميزاً — نفس فكرة طواجن الفرن البلدي."

  - id: m09
    name: "كبدة إسكندراني"
    en: "Alexandrian Beef Liver"
    cuisine: "مصري"
    servings: 3
    time: 20
    photo:
      dish: "Alexandrian-style beef liver: thin strips of sauteed liver with sliced green peppers and hot chillies, garlic and cumin, lemon wedges"
      vessel: "a black cast-iron skillet"
      angle: "45-degree angle"
    ingredients:
      - [beef_liver, 400, "شرائح رفيعة"]
      - [bell_pepper_green, 150, "٢ فلفل رومي"]
      - [chili_green, 20, "٢ فلفل حار"]
      - [garlic, 20, "٦ فصوص"]
      - [cumin, 2, "معلقة صغيرة"]
      - [vinegar, 10, "معلقتين صغيرتين"]
      - [lemon_juice, 20, "للتقديم"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "اغسل الكبدة وجففها، وتبّلها بالخل والكمون ونصف الثوم."
      - "سخّن الزيت على نار عالية جداً، وقلّب الكبدة ٣–٤ دقائق فقط."
      - "أضف الفلفل والحار وباقي الثوم، وقلّب دقيقتين حتى يذبل الفلفل قليلاً."
      - "رش الملح في النهاية، وقدّمها مع الليمون."
    tip: "الملح في آخر الطهي يمنع الكبدة من أن تجف وتقسو. الكبدة غنية جداً بالحديد وفيتامين أ."

  - id: m10
    name: "برجر لحمة صحي بالعيش الأسمر"
    en: "Lean Beef Burger"
    cuisine: "أمريكي"
    servings: 2
    time: 25
    photo:
      dish: "two lean beef burgers in toasted whole-wheat buns with melted mozzarella, crisp lettuce, tomato and red onion slices, a side of cucumber pickles"
      vessel: "a dark wooden board"
      angle: "low eye-level side view"
    ingredients:
      - [beef_lean_ground, 300, "لحمة مفرومة ٥٪"]
      - [onion, 60, "٢٠ للبرجر و٤٠ شرائح"]
      - [garlic, 3, "فص"]
      - [black_pepper, 1, "رشة"]
      - [bread_whole, 120, "٢ عيش برجر أسمر"]
      - [mozzarella_light, 30, "شريحتين"]
      - [romaine, 30, "ورقتين خس"]
      - [tomato, 80, "شرائح"]
      - [cucumber, 60, "شرائح"]
      - [mustard, 10, "معلقتين صغيرتين"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "اخلط اللحمة مع ٢٠ جم بصل مبشور والثوم والفلفل والملح، وشكّل قرصين أعرض قليلاً من العيش."
      - "اشوِ البرجر في طاسة جريل ساخنة ٤ دقائق لكل جانب، وضع الموتزاريلا في آخر دقيقة."
      - "حمّص العيش، وادهنه بالمستردة."
      - "رتّب الخس والبرجر والطماطم والبصل والخيار داخل العيش."
    tip: "اعمل تجويفاً صغيراً في منتصف القرص بإصبعك حتى لا ينتفخ أثناء الشوي."

  - id: m11
    name: "كوسة محشية لحمة في الفرن (كيتو)"
    en: "Keto Beef-Stuffed Zucchini Boats"
    cuisine: "متوسطي"
    servings: 3
    time: 40
    photo:
      dish: "six halved zucchini boats filled with seasoned minced beef and tomato, topped with bubbling golden mozzarella and parsley"
      vessel: "a dark rectangular baking dish"
      angle: "45-degree angle"
    ingredients:
      - [zucchini, 600, "٣ كوسات كبيرة"]
      - [beef_lean_ground, 300, "لحمة مفرومة ٥٪"]
      - [onion, 60, "نصف بصلة"]
      - [tomato, 150, "ثمرة مفرومة"]
      - [garlic, 5, "فص"]
      - [mozzarella_light, 45, "مبشورة"]
      - [olive_oil, 5, "معلقة صغيرة"]
      - [parsley, 5, "للتزيين"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "سخّن الفرن على ٢٠٠°. اقسم الكوسة بالطول وافرّغ لبها، وافرم اللب."
      - "شوّح البصل والثوم في الزيت، ثم أضف اللحمة حتى تتحمر، ثم الطماطم ولب الكوسة واتركها ٥ دقائق."
      - "احشُ الكوسة بالخليط ورصها في صينية، ورش الموتزاريلا."
      - "اخبزها ٢٠ دقيقة حتى تنضج الكوسة وتتحمر الجبنة."
    tip: "لب الكوسة المفروم يزيد حجم الحشوة بدون سعرات تقريباً — لا ترمه."

  - id: m12
    name: "طبق شاورما اللحمة"
    en: "Beef Shawarma Plate"
    cuisine: "شامي"
    servings: 3
    time: 35
    photo:
      dish: "beef shawarma plate: thin spiced seared beef slices, chopped tomato-cucumber-onion salad, a drizzle of tahini sauce, pickled turnip slices and a warm whole-wheat pita"
      vessel: "a wide matte black oval platter"
      angle: "45-degree angle"
    ingredients:
      - [beef_lean, 400, "شرائح رفيعة جداً"]
      - [yogurt_low, 60, "للتتبيلة"]
      - [vinegar, 15, "معلقة كبيرة"]
      - [garlic, 10, "٣ فصوص"]
      - [paprika, 2, "معلقة صغيرة"]
      - [cumin, 2, "معلقة صغيرة"]
      - [cinnamon, 1, "رشة"]
