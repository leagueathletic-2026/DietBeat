    photo:
      dish: "a tall glass of thick creamy beige banana peanut-butter smoothie, a sprinkle of oats on top, half a banana and a small spoon of peanut butter beside it"
      vessel: "a tall clear glass on a black stone coaster"
      angle: "eye-level side view"
    ingredients:
      - [banana, 120, "موزة كبيرة (مجمدة أفضل)"]
      - [greek_yogurt_0, 150, "علبة صغيرة"]
      - [milk_skim, 150, "ثلثا كوب"]
      - [peanut_butter, 15, "معلقة كبيرة"]
      - [oats, 20, "معلقتين كبيرتين"]
      - [cinnamon, 0, "رشة قرفة (اختياري)"]
    steps:
      - "ضع كل المكونات في الخلاط."
      - "اضربها دقيقة حتى يصبح القوام ناعماً وكثيفاً."
      - "قدّمه فوراً، وأضف ثلجاً إذا كان الموز غير مجمد."
    tip: "مناسب جداً بعد التمرين: بروتين من الزبادي واللبن وكربوهيدرات سريعة من الموز."

  - id: b11
    name: "شوفان مخبوز بالتفاح والقرفة"
    en: "Baked Apple Cinnamon Oatmeal"
    cuisine: "عالمي"
    servings: 4
    time: 40
    photo:
      dish: "a square of golden baked apple cinnamon oatmeal topped with thin caramelised apple slices and chopped walnuts, the rest of the bake in the dish behind"
      vessel: "a rectangular dark ceramic baking dish and a small black plate"
      angle: "45-degree angle"
    ingredients:
      - [oats, 160, "كوبين"]
      - [apple, 240, "٢ تفاحة متوسطة"]
      - [milk_1, 360, "كوب ونصف"]
      - [egg, 50, "بيضة"]
      - [walnuts, 20, "حفنة صغيرة"]
      - [honey, 20, "معلقة كبيرة"]
      - [baking_powder, 4, "معلقة صغيرة"]
      - [cinnamon, 3, "معلقة صغيرة"]
      - [vanilla, 3, "قطرات"]
    steps:
      - "سخّن الفرن على ١٨٠°. ابشر تفاحة ونصف، وقطّع النصف الباقي شرائح رفيعة."
      - "اخلط الشوفان والبيكنج باودر والقرفة في وعاء."
      - "اخفق اللبن والبيض والعسل والفانيليا، وأضفه للشوفان مع التفاح المبشور."
      - "صبه في طبق مدهون، ورص شرائح التفاح وعين الجمل فوقه."
      - "اخبزه ٣٠–٣٥ دقيقة حتى يتماسك ويتحمر الوش، وقطّعه ٤ قطع."
    tip: "حضّره مرة واحدة في الأسبوع: يُحفظ ٤ أيام في الثلاجة ويُسخّن في دقيقة."

