chapter:
  id: breakfast
  title: "الفطار"
  en: "Breakfast"
  kind: breakfast
  color: "#d9702b"
  intro: "بداية يوم مُشبعة بالبروتين والألياف — من الفول المدمس والشكشوكة إلى الشوفان والأومليت."

recipes:
  - id: b01
    name: "فول مدمس بزيت الزيتون والكمون"
    en: "Egyptian Ful Medames"
    cuisine: "مصري"
    servings: 2
    time: 10
    photo:
      dish: "Egyptian ful medames: a bowl of mashed and whole brown fava beans drizzled with olive oil, sprinkled with cumin, topped with diced tomato and chopped parsley, two small whole-wheat pita breads beside it"
      vessel: "a rustic dark grey ceramic bowl"
      angle: "45-degree angle"
    ingredients:
      - [fava_canned, 400, "علبة واحدة بسائلها"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [lemon_juice, 15, "معلقة كبيرة"]
      - [garlic, 5, "فص واحد مهروس"]
      - [cumin, 1, "نصف معلقة صغيرة"]
      - [tomato, 100, "ثمرة متوسطة مكعبات"]
      - [parsley, 10, "حفنة صغيرة مفرومة"]
      - [pita_whole, 120, "رغيفين صغار"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "سخّن الفول بسائله في حلة صغيرة على نار هادئة ٥ دقائق مع التقليب."
      - "اهرس الفول جزئياً بالمهراس واترك بعض الحبات كاملة."
      - "أضف الثوم والكمون وعصير الليمون والملح وقلّب."
      - "قدّمه في طبق، ورش فوقه الطماطم والبقدونس، ثم زيت الزيتون **قياساً بالمعلقة** وليس بالعين."
      - "قدّمه مع رغيف عيش أسمر لكل شخص."
    tip: "زيت الزيتون صحي لكنه مركز جداً: المعلقة الكبيرة = حوالي ١٢٠ سعر. قيس دائماً."
    swap: "**للكيتو:** استبدل الفول بـ ٣ بيضات مسلوقة واستغنِ عن العيش. **لبروتين أعلى:** أضف بيضة مسلوقة لكل طبق (+٧٢ سعر، +٦ جم بروتين)."

  - id: b02
    name: "أومليت بياض البيض بالسبانخ والفيتا"
    en: "Spinach & Feta Egg-White Omelette"
    cuisine: "متوسطي"
    servings: 1
    time: 10
    photo:
      dish: "a folded golden egg-white omelette with wilted spinach, diced red bell pepper and crumbled white feta visible at the fold"
      vessel: "a matte black round plate"
      angle: "45-degree angle"
    ingredients:
      - [egg, 50, "بيضة كاملة"]
      - [egg_white, 150, "بياض ٤–٥ بيضات"]
      - [spinach, 40, "حفنة كبيرة"]
      - [bell_pepper_red, 40, "ربع ثمرة مكعبات"]
      - [onion, 20, "ربع بصلة صغيرة"]
      - [feta, 20, "مكعب صغير مفتت"]
      - [olive_oil, 3, "رشة / نصف معلقة صغيرة"]
      - [black_pepper, 0, "حسب الرغبة"]
    steps:
      - "اخفق البيضة الكاملة مع بياض البيض والفلفل الأسود."
      - "سخّن طاسة غير لاصقة بالزيت، وقلّب البصل والفلفل دقيقتين، ثم أضف السبانخ حتى تذبل."
      - "صب البيض فوق الخضار واتركه على نار متوسطة حتى يتماسك من الأطراف."
      - "وزّع الفيتا على نصف الأومليت، ثم اطوِه واتركه دقيقة إضافية."
    tip: "بياض البيض بروتين شبه صافٍ بسعرات قليلة، وإضافة بيضة كاملة واحدة تعطي طعماً وقواماً أفضل."
    swap: "**للرياضيين:** قدّمه مع شريحتين توست أسمر (٥٠ جم، +١٢٥ سعر تقريباً)."

  - id: b03
    name: "شوفان الليل بالتوت والزبادي اليوناني"
    en: "Berry Greek-Yogurt Overnight Oats"
    cuisine: "عالمي"
    servings: 1
    time: 5
    photo:
      dish: "overnight oats in a glass jar layered with creamy Greek yogurt, chia seeds and fresh blueberries on top with a thin drizzle of honey, cinnamon dusting"
      vessel: "a clear glass mason jar on a dark slate board"
      angle: "eye-level side view"
    ingredients:
      - [oats, 40, "نصف كوب"]
      - [greek_yogurt_0, 150, "علبة صغيرة"]
      - [milk_skim, 80, "ثلث كوب"]
      - [chia, 10, "معلقة كبيرة"]
      - [blueberries, 60, "حفنة"]
      - [honey, 5, "معلقة صغيرة"]
      - [cinnamon, 1, "رشة"]
    steps:
      - "في برطمان، اخلط الشوفان والزبادي واللبن والشيا والقرفة جيداً."
      - "غطِّ البرطمان واتركه في الثلاجة ٦ ساعات على الأقل أو طوال الليل."
      - "في الصباح قلّبه، وزيّنه بالتوت وخيط من العسل."
    tip: "حضّر ٣–٤ برطمانات مرة واحدة: تحفظ في الثلاجة حتى ٣ أيام وتوفر وقت الصباح."
    swap: "**لسعرات أقل:** استغنِ عن العسل (−١٥ سعر). **بديل التوت:** فراولة أو تفاح مبشور."

  - id: b04
    name: "شكشوكة بالفلفل والطماطم"
    en: "Classic Shakshuka"
    cuisine: "مغاربي / عربي"
    servings: 2
    time: 20
    photo:
      dish: "shakshuka with exactly four eggs (4 eggs) poached with runny yolks in a rich red tomato and green bell pepper sauce, sprinkled with paprika and cumin"
      vessel: "a black cast-iron skillet"
      angle: "overhead top-down view"
    ingredients:
      - [egg, 200, "٤ بيضات"]
      - [tomato, 300, "٣ ثمرات متوسطة مبشورة"]
      - [bell_pepper_green, 100, "ثمرة متوسطة"]
      - [onion, 80, "بصلة صغيرة"]
      - [garlic, 5, "فص"]
      - [tomato_paste, 15, "معلقة كبيرة"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [cumin, 1, "نصف معلقة صغيرة"]
      - [paprika, 1, "نصف معلقة صغيرة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "سخّن الزيت في طاسة واسعة، وقلّب البصل والفلفل ٤ دقائق حتى يذبلا."
      - "أضف الثوم والكمون والبابريكا وقلّب ٣٠ ثانية."
      - "أضف الطماطم والصلصة والملح، واتركها تتسبك ٨ دقائق."
      - "اعمل ٤ تجاويف في الصلصة واكسر في كل منها بيضة، ثم غطِّ الطاسة ٥–٦ دقائق حتى يتماسك البياض."
    tip: "إذا كنت تفضّل الصفار سائلاً، ارفع الطاسة عن النار بمجرد أن يتماسك البياض."
    swap: "**لوجبة أكبر:** قدّمها مع رغيف عيش أسمر صغير (+١٦٠ سعر). **لبروتين أعلى:** أضف ٥٠ جم جبنة قريش فوق الوش."

  - id: b05
    name: "توست الأفوكادو بالبيض المسلوق"
    en: "Avocado Toast with Boiled Eggs"
    cuisine: "عالمي"
    servings: 1
    time: 12
    photo:
      dish: "two slices of toasted whole-wheat bread topped with smashed avocado, sliced boiled eggs showing jammy yolks, chili flakes and a squeeze of lemon"
      vessel: "a dark speckled stoneware plate"
      angle: "45-degree angle"
    ingredients:
      - [bread_whole, 60, "شريحتين"]
      - [avocado, 60, "نصف ثمرة صغيرة"]
      - [egg, 100, "٢ بيضة"]
      - [lemon_juice, 5, "رشة"]
      - [chili_green, 0, "شطة حسب الرغبة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "اسلق البيض ٨ دقائق لصفار نصف متماسك، ثم ضعه في ماء بارد وقشّره."
      - "حمّص شرائح التوست."
      - "اهرس الأفوكادو بالشوكة مع الليمون والملح، وافرده على التوست."
      - "قطّع البيض شرائح ورصّه فوق الأفوكادو، ورش الشطة."
    tip: "الأفوكادو غني بالدهون المفيدة لكنه عالي السعرات — نصف ثمرة صغيرة كافية لشريحتين."
    swap: "**للكيتو:** قدّم الأفوكادو والبيض بدون التوست في نصف ثمرة أفوكادو."

  - id: b06
    name: "بان كيك الشوفان والموز بالبروتين"
    en: "Protein Oat & Banana Pancakes"
    cuisine: "عالمي"
    servings: 2
    time: 20
    photo:
      dish: "a stack of five fluffy golden oat and banana pancakes topped with fresh banana slices, a few raspberries and a light drizzle of honey"
      vessel: "a matte black plate"
      angle: "low eye-level side view"
    ingredients:
      - [oats, 80, "كوب إلا ربع"]
      - [banana, 120, "موزة كبيرة ناضجة"]
      - [egg_white, 120, "بياض ٤ بيضات"]
      - [cottage_cheese, 100, "نصف كوب"]
      - [baking_powder, 4, "معلقة صغيرة"]
      - [cinnamon, 1, "رشة"]
      - [raspberries, 60, "للتزيين"]
      - [honey, 10, "معلقتين صغيرتين"]
      - [coconut_oil, 4, "لدهن الطاسة"]
    steps:
      - "اطحن الشوفان في الخلاط حتى يصبح دقيقاً، ثم أضف نصف الموز وبياض البيض والجبنة القريش والبيكنج باودر والقرفة واخلط حتى يصبح ناعماً."
      - "سخّن طاسة غير لاصقة وادهنها بطبقة رقيقة جداً من الزيت."
      - "صب ربع كوب من الخليط لكل قرص، واتركه حتى تظهر فقاعات على السطح ثم اقلبه دقيقة."
      - "قدّمه مع باقي الموز شرائح والتوت وخيط من العسل."
    tip: "الجبنة القريش تضاعف البروتين وتعطي قواماً هشاً بدون زبدة."

  - id: b07
    name: "مافن البيض بالخضار"
    en: "Veggie Egg Muffins"
    cuisine: "عالمي"
    servings: 3
    time: 25
    photo:
      dish: "six golden baked egg muffins studded with spinach, red bell pepper, onion and melted mozzarella, one cut in half"
      vessel: "a black muffin tin and a slate board"
      angle: "45-degree angle"
    ingredients:
      - [egg, 300, "٦ بيضات"]
      - [spinach, 60, "حفنة كبيرة مفرومة"]
      - [bell_pepper_red, 80, "نصف ثمرة مكعبات"]
      - [onion, 40, "ربع بصلة"]
      - [mozzarella_light, 40, "مبشورة"]
      - [olive_oil, 3, "لدهن القالب"]
      - [black_pepper, 0, "حسب الرغبة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "سخّن الفرن على ١٨٠° وادهن ٦ أكواب من قالب المافن بالزيت."
      - "وزّع السبانخ والفلفل والبصل على الأكواب."
      - "اخفق البيض مع الملح والفلفل، وصبه فوق الخضار حتى ثلاثة أرباع الكوب، ثم رش الموتزاريلا."
      - "اخبزها ١٨–٢٠ دقيقة حتى تنتفخ وتتماسك."
    tip: "تحفظ في الثلاجة ٤ أيام — سخّن قطعتين في الميكروويف ٣٠ ثانية لفطار جاهز. الحصة = قطعتين."

  - id: b08
    name: "طبق الجبنة القريش بالخضار وزيت الزيتون"
    en: "Egyptian Cottage Cheese Plate"
    cuisine: "مصري"
    servings: 1
    time: 5
    photo:
      dish: "a mound of fresh white Egyptian cottage cheese (areesh) drizzled with olive oil and sprinkled with dried mint, with tomato wedges, cucumber slices, black olives and a small whole-wheat pita"
      vessel: "an oval dark grey ceramic platter"
      angle: "overhead top-down view"
    ingredients:
      - [cottage_cheese, 150, "٣ معالق كبيرة ممتلئة"]
      - [tomato, 100, "ثمرة"]
      - [cucumber, 100, "خيارة"]
      - [olives, 15, "٤ حبات"]
      - [olive_oil, 5, "معلقة صغيرة"]
      - [pita_whole, 60, "رغيف صغير"]
      - [mint, 0, "نعناع ناشف حسب الرغبة"]
    steps:
      - "ضع الجبنة القريش في طبق، واعمل فيها تجويفاً بالمعلقة."
      - "صب زيت الزيتون في التجويف، ورش النعناع."
      - "قطّع الطماطم والخيار، وقدّمها مع الزيتون والعيش."
    tip: "الجبنة القريش من أعلى الأجبان بروتيناً وأقلها دهوناً — بديل مثالي للجبن الرومي والأجبان المطبوخة."

  - id: b09
    name: "عجة بالبقدونس في الفرن"
    en: "Oven-Baked Egyptian Eggah"
    cuisine: "مصري"
    servings: 3
    time: 30
    photo:
      dish: "a thick golden baked Egyptian herb omelette (eggah) green with parsley and dill, cut into wedges, one wedge lifted to show the fluffy green-flecked inside"
      vessel: "a round black ceramic baking dish"
      angle: "45-degree angle"
    ingredients:
      - [egg, 300, "٦ بيضات"]
      - [parsley, 40, "حزمة مفرومة"]
      - [dill, 15, "قليل من الشبت"]
      - [onion, 60, "نصف بصلة مبشورة"]
      - [flour_whole, 15, "معلقة كبيرة"]
      - [baking_powder, 2, "نصف معلقة صغيرة"]
      - [cumin, 1, "رشة"]
      - [olive_oil, 8, "معلقة صغيرة ونصف"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "سخّن الفرن على ١٨٠°، وادهن طبقاً مقاس ٢٠ سم بالزيت."
      - "اخفق البيض مع الدقيق والبيكنج باودر والكمون والملح حتى لا يبقى تكتلات."
      - "أضف البقدونس والشبت والبصل المعصور من مائه، وقلّب."
      - "صبه في الطبق واخبزه ٢٠ دقيقة حتى ينتفخ ويتحمر الوش، ثم قطّعه ٦ مثلثات."
    tip: "العجة في الفرن بدلاً من القلي العميق توفر الكثير من الزيت وتبقى هشة ومنفوخة."
    swap: "**لوجبة متكاملة:** قدّمها مع سلطة خضراء ونصف رغيف أسمر (٣٠ جم، +٧٨ سعر)."

  - id: b10
    name: "سموذي البروتين بالموز وزبدة الفول السوداني"
