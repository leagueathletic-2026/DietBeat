chapter:
  id: breakfast
  title: "الفطار"
  en: "Breakfast"
  kind: breakfast
  color: "#d9702b"
  intro: "بداية يوم مُشبعة بالبروتين والألياف — من الفول المدمس والشكشوكة إلى الشوفان والأومليت."

recipes:
  - id: b01
    name: "فول مدمس بزيت الزيتون والكمون"
    en: "Egyptian Ful Medames"
    cuisine: "مصري"
    servings: 2
    time: 10
    photo:
      dish: "Egyptian ful medames: a bowl of mashed and whole brown fava beans drizzled with olive oil, sprinkled with cumin, topped with diced tomato and chopped parsley, two small whole-wheat pita breads beside it"
      vessel: "a rustic dark grey ceramic bowl"
      angle: "45-degree angle"
    ingredients:
      - [fava_canned, 400, "علبة واحدة بسائلها"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [lemon_juice, 15, "معلقة كبيرة"]
      - [garlic, 5, "فص واحد مهروس"]
      - [cumin, 1, "نصف معلقة صغيرة"]
      - [tomato, 100, "ثمرة متوسطة مكعبات"]
      - [parsley, 10, "حفنة صغيرة مفرومة"]
      - [pita_whole, 120, "رغيفين صغار"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "سخّن الفول بسائله في حلة صغيرة على نار هادئة ٥ دقائق مع التقليب."
      - "اهرس الفول جزئياً بالمهراس واترك بعض الحبات كاملة."
      - "أضف الثوم والكمون وعصير الليمون والملح وقلّب."
      - "قدّمه في طبق، ورش فوقه الطماطم والبقدونس، ثم زيت الزيتون **قياساً بالمعلقة** وليس بالعين."
      - "قدّمه مع رغيف عيش أسمر لكل شخص."
    tip: "زيت الزيتون صحي لكنه مركز جداً: المعلقة الكبيرة = حوالي ١٢٠ سعر. قيس دائماً."
    swap: "**للكيتو:** استبدل الفول بـ ٣ بيضات مسلوقة واستغنِ عن العيش. **لبروتين أعلى:** أضف بيضة مسلوقة لكل طبق (+٧٢ سعر، +٦ جم بروتين)."

  - id: b02
    name: "أومليت بياض البيض بالسبانخ والفيتا"
    en: "Spinach & Feta Egg-White Omelette"
    cuisine: "متوسطي"
    servings: 1
    time: 10
    photo:
      dish: "a folded golden egg-white omelette with wilted spinach, diced red bell pepper and crumbled white feta visible at the fold"
      vessel: "a matte black round plate"
      angle: "45-degree angle"
    ingredients:
      - [egg, 50, "بيضة كاملة"]
      - [egg_white, 150, "بياض ٤–٥ بيضات"]
      - [spinach, 40, "حفنة كبيرة"]
      - [bell_pepper_red, 40, "ربع ثمرة مكعبات"]
      - [onion, 20, "ربع بصلة صغيرة"]
      - [feta, 20, "مكعب صغير مفتت"]
      - [olive_oil, 3, "رشة / نصف معلقة صغيرة"]
      - [black_pepper, 0, "حسب الرغبة"]
    steps:
      - "اخفق البيضة الكاملة مع بياض البيض والفلفل الأسود."
      - "سخّن طاسة غير لاصقة بالزيت، وقلّب البصل والفلفل دقيقتين، ثم أضف السبانخ حتى تذبل."
      - "صب البيض فوق الخضار واتركه على نار متوسطة حتى يتماسك من الأطراف."
      - "وزّع الفيتا على نصف الأومليت، ثم اطوِه واتركه دقيقة إضافية."
    tip: "بياض البيض بروتين شبه صافٍ بسعرات قليلة، وإضافة بيضة كاملة واحدة تعطي طعماً وقواماً أفضل."
    swap: "**للرياضيين:** قدّمه مع شريحتين توست أسمر (٥٠ جم، +١٢٥ سعر تقريباً)."

  - id: b03
    name: "شوفان الليل بالتوت والزبادي اليوناني"
    en: "Berry Greek-Yogurt Overnight Oats"
    cuisine: "عالمي"
    servings: 1
    time: 5
    photo:
      dish: "overnight oats in a glass jar layered with creamy Greek yogurt, chia seeds and fresh blueberries on top with a thin drizzle of honey, cinnamon dusting"
      vessel: "a clear glass mason jar on a dark slate board"
      angle: "eye-level side view"
    ingredients:
      - [oats, 40, "نصف كوب"]
      - [greek_yogurt_0, 150, "علبة صغيرة"]
      - [milk_skim, 80, "ثلث كوب"]
      - [chia, 10, "معلقة كبيرة"]
      - [blueberries, 60, "حفنة"]
      - [honey, 5, "معلقة صغيرة"]
      - [cinnamon, 1, "رشة"]
    steps:
      - "في برطمان، اخلط الشوفان والزبادي واللبن والشيا والقرفة جيداً."
      - "غطِّ البرطمان واتركه في الثلاجة ٦ ساعات على الأقل أو طوال الليل."
      - "في الصباح قلّبه، وزيّنه بالتوت وخيط من العسل."
    tip: "حضّر ٣–٤ برطمانات مرة واحدة: تحفظ في الثلاجة حتى ٣ أيام وتوفر وقت الصباح."
    swap: "**لسعرات أقل:** استغنِ عن العسل (−١٥ سعر). **بديل التوت:** فراولة أو تفاح مبشور."

  - id: b04
    name: "شكشوكة بالفلفل والطماطم"
    en: "Classic Shakshuka"
    cuisine: "مغاربي / عربي"
    servings: 2
    time: 20
    photo:
      dish: "shakshuka with exactly four eggs (4 eggs) poached with runny yolks in a rich red tomato and green bell pepper sauce, sprinkled with paprika and cumin"
      vessel: "a black cast-iron skillet"
      angle: "overhead top-down view"
    ingredients:
      - [egg, 200, "٤ بيضات"]
      - [tomato, 300, "٣ ثمرات متوسطة مبشورة"]
      - [bell_pepper_green, 100, "ثمرة متوسطة"]
      - [onion, 80, "بصلة صغيرة"]
      - [garlic, 5, "فص"]
      - [tomato_paste, 15, "معلقة كبيرة"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [cumin, 1, "نصف معلقة صغيرة"]
      - [paprika, 1, "نصف معلقة صغيرة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "سخّن الزيت في طاسة واسعة، وقلّب البصل والفلفل ٤ دقائق حتى يذبلا."
      - "أضف الثوم والكمون والبابريكا وقلّب ٣٠ ثانية."
      - "أضف الطماطم والصلصة والملح، واتركها تتسبك ٨ دقائق."
      - "اعمل ٤ تجاويف في الصلصة واكسر في كل منها بيضة، ثم غطِّ الطاسة ٥–٦ دقائق حتى يتماسك البياض."
    tip: "إذا كنت تفضّل الصفار سائلاً، ارفع الطاسة عن النار بمجرد أن يتماسك البياض."
    swap: "**لوجبة أكبر:** قدّمها مع رغيف عيش أسمر صغير (+١٦٠ سعر). **لبروتين أعلى:** أضف ٥٠ جم جبنة قريش فوق الوش."
