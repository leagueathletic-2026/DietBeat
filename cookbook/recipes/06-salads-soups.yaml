chapter:
  id: salads-soups
  title: "السلطات والشوربات"
  en: "Salads & Soups"
  kind: side
  color: "#178080"
  intro: "سلطات منعشة وشوربات دافئة — كأطباق جانبية أو كوجبة خفيفة كاملة. حجم كبير بسعرات قليلة."

recipes:
  - id: s01
    name: "شوربة العدس الأصفر بالخضار"
    en: "Red Lentil & Vegetable Soup"
    cuisine: "مصري"
    servings: 4
    time: 35
    photo:
      dish: "smooth golden-orange red lentil and carrot soup with a swirl of olive oil, a pinch of cumin and a lemon wedge on the side"
      vessel: "a dark grey stoneware soup bowl"
      angle: "45-degree angle"
    ingredients:
      - [lentils_red, 200, "كوب عدس أصفر"]
      - [carrot, 150, "جزرتين"]
      - [onion, 100, "بصلة متوسطة"]
      - [tomato, 100, "ثمرة"]
      - [garlic, 10, "٣ فصوص"]
      - [cumin, 3, "معلقة صغيرة ونصف"]
      - [turmeric, 1, "نصف معلقة صغيرة"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [lemon_juice, 20, "للتقديم"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "اغسل العدس جيداً."
      - "شوّح البصل والثوم في الزيت ٣ دقائق، ثم أضف الجزر والطماطم والعدس والبهارات."
      - "أضف ١٫٢ لتر ماء، واتركها تغلي ثم هدّئ النار ٢٥ دقيقة حتى ينضج كل شيء."
      - "اضربها بالخلاط حتى تصبح ناعمة، وعدّل الملح والقوام بالماء."
      - "قدّمها مع عصير الليمون."
    tip: "الجزر يعطي الشوربة حلاوة ولوناً جميلاً، ويقلل الحاجة للمرقة الجاهزة الغنية بالملح."
    swap: "**لوجبة كاملة:** قدّمها مع ٢ ملعقة زبادي يوناني وشريحة عيش أسمر محمص."

  - id: s02
    name: "فتوش صحي"
    en: "Lighter Fattoush"
    cuisine: "شامي"
    servings: 2
    time: 15
    photo:
      dish: "fattoush salad: chopped romaine, tomato, cucumber, radish slices, green onion, parsley and mint with crunchy toasted whole-wheat pita pieces, sprinkled with sumac"
      vessel: "a wide black salad bowl"
      angle: "overhead top-down view"
    ingredients:
      - [romaine, 150, "نصف رأس خس"]
      - [tomato, 150, "ثمرة كبيرة"]
      - [cucumber, 150, "خيارة كبيرة"]
      - [radish, 50, "٤ حبات فجل"]
      - [green_onion, 30, "عودين"]
      - [parsley, 20, "حفنة"]
      - [mint, 10, "أوراق نعناع"]
      - [pita_whole, 30, "نصف رغيف أسمر صغير"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [lemon_juice, 20, "معلقة كبيرة ونصف"]
      - [salt, 0, "سماق وملح حسب الرغبة"]
    steps:
      - "قطّع العيش مربعات صغيرة، وحمّصه في الفرن ٨ دقائق حتى يقرمش — بدون قلي."
      - "قطّع الخضار قطعاً كبيرة، وافرم الأعشاب."
      - "اخفق الزيت والليمون والسماق والملح."
      - "اخلط الخضار بالصوص قبل التقديم مباشرة، ثم أضف العيش المحمص فوقه."
    tip: "أضف العيش في آخر لحظة حتى يبقى مقرمشاً."
    swap: "**كوجبة غداء:** أضف ١٢٠ جم صدور فراخ مشوية للطبق (+١٤٥ سعر و+٢٧ جم بروتين)."

  - id: s03
    name: "تبولة بالكينوا"
    en: "Quinoa Tabbouleh"
    cuisine: "شامي"
    servings: 3
    time: 25
    photo:
      dish: "quinoa tabbouleh: finely chopped parsley and mint with quinoa, diced tomato, cucumber and green onion, lemon and olive oil sheen"
      vessel: "a shallow dark ceramic bowl"
      angle: "45-degree angle"
    ingredients:
      - [quinoa, 80, "ثلث كوب (قبل الطهي)"]
      - [parsley, 120, "٣ حزم بقدونس"]
      - [mint, 15, "حفنة نعناع"]
      - [tomato, 200, "ثمرتين"]
      - [cucumber, 100, "خيارة"]
      - [green_onion, 30, "عودين"]
      - [olive_oil, 15, "معلقة كبيرة"]
      - [lemon_juice, 40, "عصير ليمونة كبيرة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "اطهِ الكينوا في ضعف حجمها ماء ١٢–١٥ دقيقة، ثم افردها لتبرد تماماً."
      - "افرم البقدونس والنعناع ناعماً جداً بسكين حاد (بعد تجفيفهما جيداً)."
      - "قطّع الطماطم والخيار والبصل الأخضر مكعبات صغيرة."
      - "اخلط الكل مع الزيت والليمون والملح، وقدّمها باردة."
    tip: "الكينوا بروتين كامل وخالية من الجلوتين — بديل ممتاز للبرغل."
    swap: "**التبولة التقليدية:** استبدل الكينوا بنفس الوزن برغل ناعم منقوع."

  - id: s04
    name: "شوربة خضار بالفراخ"
    en: "Chicken & Vegetable Soup"
    cuisine: "عالمي"
    servings: 4
    time: 45
    photo:
      dish: "clear chicken and vegetable soup with shredded chicken breast, carrot, zucchini and celery pieces, chopped parsley"
      vessel: "a black soup bowl"
      angle: "45-degree angle"
    ingredients:
      - [chicken_breast, 250, "صدر كبير"]
      - [carrot, 150, "جزرتين"]
      - [zucchini, 200, "٢ كوسة"]
      - [celery, 80, "عودين كرفس"]
      - [onion, 100, "بصلة"]
      - [garlic, 10, "٣ فصوص"]
      - [chicken_broth, 1000, "لتر مرقة فراخ"]
      - [olive_oil, 5, "معلقة صغيرة"]
      - [parsley, 10, "للتزيين"]
      - [black_pepper, 0, "حسب الرغبة"]
    steps:
      - "شوّح البصل والثوم والكرفس في الزيت ٤ دقائق."
      - "أضف المرقة والفراخ كاملة، واتركها تغلي ثم هدّئ النار ٢٠ دقيقة."
      - "أخرج الفراخ وقطّعها، وأضف الجزر والكوسة مكعبات للحلة ١٠ دقائق."
      - "أرجع الفراخ، وتبّل بالفلفل، وزيّن بالبقدونس."
    tip: "المرقة الجاهزة غنية بالصوديوم — استخدم مرقة منزلية أو قليلة الملح ولا تضف ملحاً قبل التذوق."
    swap: "**لوجبة أكبر:** أضف ٣٠ جم شعرية أو لسان عصفور للحصة (+١١٠ سعر)."
