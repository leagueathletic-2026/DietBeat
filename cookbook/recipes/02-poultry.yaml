      - "اخفق الزبادي اليوناني مع باقي الثوم والليمون والملح، وقدّمه مع الأسياخ."
    tip: "الصلصة والزبادي في التتبيلة يعطيان اللون الأحمر المميز بدون صبغات أو زيت كثير."

