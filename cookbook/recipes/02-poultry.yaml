  - id: p12
    name: "ملوخية بالفراخ"
    en: "Egyptian Molokhia with Chicken"
    cuisine: "مصري"
    servings: 3
    time: 40
    photo:
      dish: "a bowl of glossy deep-green Egyptian molokhia soup with a garlic-coriander topping, beside a plate of poached chicken breast pieces"
      vessel: "a dark clay bowl and a matching small plate"
      angle: "45-degree angle"
    ingredients:
      - [molokhia, 400, "ملوخية مخروطة (طازجة أو مجمدة)"]
      - [chicken_breast, 300, "صدر فراخ"]
      - [chicken_broth, 700, "شوربة فراخ"]
