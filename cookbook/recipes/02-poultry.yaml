      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "اسلق الفراخ في الشوربة مع الملح ٢٠ دقيقة حتى تنضج، ثم أخرجها."
      - "اغلِ الشوربة، وأضف الملوخية مع التقليب، واتركها حتى تبدأ تغلي ثم اطفئ النار فوراً."
      - "اهرس الثوم مع الكزبرة، وشوّحهما في الزيت حتى يصفرّ الثوم، وأضفهما للملوخية (الطشة)."
