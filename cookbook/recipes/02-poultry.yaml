      - "تبّل الفراخ بالملح والفلفل، وحمّرها في الزيت ٥ دقائق لكل جانب، ثم ارفعها."
      - "في نفس الطاسة، ذوّب الزبدة وشوّح البصل والثوم والمشروم حتى يتحمر."
      - "أضف الجبنة الكريمي واللبن وقلّب حتى يصبح صوصاً ناعماً، ثم السبانخ."
      - "أرجع الفراخ للصوص ٣ دقائق حتى تنضج تماماً."
    tip: "الجبنة الكريمي اللايت مع اللبن تعطي صوصاً كريمياً بجزء صغير من سعرات الكريمة."

