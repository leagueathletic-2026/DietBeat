chapter:
  id: poultry
  title: "الدواجن"
  en: "Chicken & Turkey"
  kind: main
  color: "#1f7a55"
  intro: "صدور وأوراك الفراخ والديك الرومي بطرق مشوية ومخبوزة وسريعة — بروتين عالٍ بسعرات محسوبة."

recipes:
  - id: p01
    name: "صدور فراخ بالليمون والثوم مع رز بني وخضار"
    en: "Lemon-Garlic Chicken with Brown Rice"
    cuisine: "متوسطي"
    servings: 2
    time: 35
    photo:
      dish: "sliced grilled lemon-garlic chicken breast with paprika crust, a scoop of brown rice, sauteed zucchini and carrot slices, lemon wedge"
      vessel: "a wide matte charcoal plate"
      angle: "45-degree angle"
    ingredients:
      - [chicken_breast, 300, "صدرين متوسطين"]
      - [rice_brown, 100, "نصف كوب (قبل الطهي)"]
      - [zucchini, 150, "كوسايتين"]
      - [carrot, 100, "جزرة كبيرة"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [lemon_juice, 20, "عصير نصف ليمونة"]
      - [garlic, 6, "فصين"]
      - [paprika, 2, "معلقة صغيرة"]
      - [cumin, 1, "نصف معلقة صغيرة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "اسلق الرز البني في ضعفين ونصف حجمه ماء مع رشة ملح لمدة ٣٠ دقيقة تقريباً."
      - "تبّل الفراخ بالليمون والثوم والبابريكا والكمون ونصف الزيت، واتركها ١٥ دقيقة على الأقل."
      - "اشوِ الفراخ في جريل أو طاسة ساخنة ٥–٦ دقائق لكل جانب حتى تنضج تماماً من الداخل."
      - "قطّع الكوسة والجزر شرائح، وقلّبها في باقي الزيت ٥ دقائق مع رشة ملح."
      - "قسّم الرز والخضار والفراخ على طبقين."
    tip: "اترك الفراخ ٥ دقائق بعد الشوي قبل التقطيع لتحتفظ بعصارتها."
    swap: "**للكيتو:** استبدل الرز بـ ٢٠٠ جم قرنبيط مبشور مشوح. **لسعرات أقل:** قلل الرز إلى ٦٠ جم."

  - id: p02
    name: "فراخ تكا بالزبادي مع سلطة الخيار بالنعناع"
    en: "Yogurt Chicken Tikka with Cucumber-Mint Salad"
    cuisine: "هندي"
    servings: 2
    time: 30
    photo:
      dish: "yogurt-marinated chicken tikka cubes with orange-red spice char on wooden skewers, a small bowl of cucumber and mint salad"
      vessel: "a dark stone serving board"
      angle: "low 30-degree angle"
    ingredients:
      - [chicken_breast, 350, "مكعبات كبيرة"]
      - [yogurt_low, 100, "نصف علبة"]
      - [lemon_juice, 15, "معلقة كبيرة"]
      - [garlic, 6, "فصين"]
      - [ginger, 5, "قطعة صغيرة مبشورة"]
      - [paprika, 4, "معلقتين صغيرتين"]
      - [cumin, 2, "معلقة صغيرة"]
      - [turmeric, 1, "نصف معلقة صغيرة"]
      - [olive_oil, 8, "معلقة صغيرة ونصف"]
      - [cucumber, 200, "خيارتين"]
      - [mint, 5, "أوراق قليلة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "اخلط الزبادي والليمون والثوم والجنزبيل والبهارات والزيت، وأضف الفراخ وقلّب."
      - "غطِّ الوعاء واتركه في الثلاجة ساعة على الأقل (ويُفضل ليلة كاملة)."
      - "اشبك الفراخ في أسياخ واشوِها في فرن ساخن ٢٢٠° لمدة ١٥–١٨ دقيقة، مع التقليب مرة."
      - "قطّع الخيار، واخلطه مع النعناع المفروم ورشة ملح وقطرات ليمون."
    tip: "الزبادي يطري الفراخ ويغنيك عن الزيت الكثير — تتبيلة ممتازة لأي بروتين."
    swap: "**للرياضيين:** أضف ٦٠ جم رز أبيض (قبل الطهي) لكل طبق (+٢٢٠ سعر)."

  - id: p03
    name: "شاورما فراخ صحية في تورتيلا أسمر"
    en: "Lighter Chicken Shawarma Wrap"
    cuisine: "شامي"
    servings: 2
    time: 30
    photo:
      dish: "two halved whole-wheat tortilla shawarma wraps showing sliced spiced chicken, romaine lettuce, tomato and tahini-yogurt sauce"
      vessel: "a black parchment-lined board"
      angle: "45-degree angle"
    ingredients:
      - [chicken_thigh, 300, "أوراك منزوعة الجلد والعظم"]
      - [yogurt_low, 100, "٦٠ جم للتتبيلة و٤٠ للصوص"]
      - [vinegar, 10, "معلقتين صغيرتين"]
      - [garlic, 8, "٣ فصوص"]
      - [paprika, 3, "معلقة صغيرة"]
      - [cumin, 2, "معلقة صغيرة"]
      - [cinnamon, 1, "رشة"]
      - [tahini, 15, "معلقة كبيرة"]
      - [lemon_juice, 15, "معلقة كبيرة"]
      - [tortilla_whole, 90, "٢ رغيف تورتيلا"]
      - [tomato, 100, "ثمرة"]
      - [romaine, 50, "ورقتين خس"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "تبّل الفراخ بـ ٦٠ جم زبادي والخل ونصف الثوم والبهارات، واتركها ٣٠ دقيقة."
      - "اشوِ الفراخ في طاسة جريل ساخنة ٥–٦ دقائق لكل جانب، ثم قطّعها شرائح رفيعة."
      - "اخلط الطحينة مع باقي الزبادي والليمون وباقي الثوم وقليل من الماء حتى يصبح صوصاً ناعماً."
      - "سخّن التورتيلا، وافرد عليها الصوص ثم الخس والطماطم والفراخ، ولفّها بإحكام."
    tip: "أوراك الفراخ أطرى وألذ في الشاورما من الصدور، وبدون الجلد تبقى قليلة الدهون."
    swap: "**للكيتو:** قدّم الحشوة في أوراق خس كبيرة بدلاً من التورتيلا."

  - id: p04
    name: "فراخ بالبروكلي على الطريقة الآسيوية"
    en: "Chicken & Broccoli Stir-Fry"
    cuisine: "آسيوي"
    servings: 2
    time: 20
    photo:
      dish: "chicken and broccoli stir-fry with red bell pepper strips in a glossy soy-honey-ginger sauce, sprinkled with sesame seeds"
      vessel: "a black carbon-steel wok"
      angle: "overhead top-down view"
    ingredients:
      - [chicken_breast, 300, "شرائح رفيعة"]
      - [broccoli, 250, "رأس صغير"]
      - [bell_pepper_red, 100, "ثمرة متوسطة"]
      - [garlic, 6, "فصين"]
      - [ginger, 5, "قطعة صغيرة"]
      - [soy_sauce_light, 20, "معلقة كبيرة ونصف"]
      - [honey, 8, "معلقة صغيرة"]
      - [cornstarch, 6, "معلقتين صغيرتين"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [sesame, 5, "معلقة صغيرة للتزيين"]
    steps:
      - "اخلط الصويا صوص والعسل والنشا مع ٦٠ مل ماء — هذا هو الصوص."
      - "سخّن نصف الزيت في طاسة واسعة على نار عالية، وشوّح الفراخ ٤–٥ دقائق حتى تتحمر ثم ارفعها."
      - "أضف باقي الزيت والثوم والجنزبيل ٣٠ ثانية، ثم البروكلي والفلفل مع ٣ معالق ماء، وغطِّها دقيقتين."
      - "أرجع الفراخ وأضف الصوص، وقلّب دقيقة حتى يتكثف ويلمع. زيّن بالسمسم."
    tip: "يجب أن تكون الطاسة ساخنة جداً قبل إضافة الفراخ حتى تتحمر ولا تُسلق في عصارتها."
    swap: "**للرياضيين:** قدّمها مع ٧٠ جم رز أبيض (قبل الطهي) للشخص (+٢٥٥ سعر)."
