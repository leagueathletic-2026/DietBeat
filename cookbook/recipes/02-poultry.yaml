      - [chicken_breast, 300, "صدرين مفرودين"]
      - [mushrooms, 200, "علبة مشروم طازج شرائح"]
      - [onion, 40, "ربع بصلة"]
      - [garlic, 6, "فصين"]
      - [butter, 5, "معلقة صغيرة"]
      - [olive_oil, 5, "معلقة صغيرة"]
