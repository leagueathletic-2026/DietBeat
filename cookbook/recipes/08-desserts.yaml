chapter:
  id: desserts
  title: "الحلويات الصحية"
  en: "Healthy Desserts"
  kind: dessert
  color: "#b8456f"
  intro: "أم علي وبودينج ومافن وآيس كريم — حلويات تشبع رغبتك في السكر بسعرات محسوبة، أغلبها ٢٠٠ سعر أو أقل."

recipes:
  - id: d00
    name: "تشيز كيك صحي بالتوت"
    en: "Healthy Berry Cheesecake"
    cuisine: "عالمي"
    servings: 8
    time: 70
    photo:
      dish: "a slice of healthy cheesecake with a golden almond-flour crust and creamy white filling, topped with fresh strawberries and blueberries, the rest of the cake behind it"
      vessel: "a matte black dessert plate"
      angle: "low eye-level side view"
    ingredients:
      - [almond_flour, 200, "كوبين"]
      - [butter, 80, "غير مملحة، مذابة"]
      - [stevia, 60, "بدون سعرات"]
      - [cream_cheese_light, 400, "بدرجة حرارة الغرفة"]
      - [greek_yogurt_0, 200, "علبة كبيرة"]
      - [egg, 100, "٢ بيضة"]
      - [vanilla, 4, "معلقة صغيرة"]
      - [lemon_zest, 2, "معلقة صغيرة"]
      - [strawberries, 80, "للتزيين"]
      - [blueberries, 70, "للتزيين"]
    steps:
      - "سخّن الفرن على ١٦٠°. اخلط دقيق اللوز مع الزبدة المذابة و٢٠ جم من المحلي، واضغطه جيداً في قاع قالب ٢٠–٢٢ سم، واخبزه ١٠ دقائق."
      - "اخفق الجبنة الكريمية مع الزبادي وباقي المحلي والفانيليا وقشر الليمون حتى يصبح القوام ناعماً تماماً."
      - "أضف البيض واحدة تلو الأخرى، واخلط على سرعة منخفضة فقط حتى يختفي — الخفق الزائد يسبب التشقق."
      - "صب الخليط فوق القاعدة، ووازن السطح، واخبزه ٤٥–٥٠ دقيقة حتى تتماسك الأطراف ويبقى المنتصف يهتز قليلاً."
      - "أطفئ الفرن واترك التشيز كيك بداخله والباب موارب ساعة، ثم في الثلاجة ٤ ساعات على الأقل."
      - "زيّنها بالتوت الطازج وقطّعها ٨ قطع."
    tip: "استخدم جبنة كريمية قليلة الدسم، ويمكن استبدال الزبادي بزبادي نباتي. تُحفظ في الثلاجة حتى ٥ أيام."
    swap: "**لسعرات أقل:** قاعدة رفيعة من ١٠٠ جم دقيق لوز و٤٠ جم زبدة (حوالي −١١٠ سعر للقطعة). **بدون جلوتين:** الوصفة خالية من الدقيق الأبيض — تأكد أن المحلي والفانيليا خاليان من الجلوتين."

  - id: d01
    name: "بودينج الشيا بالمانجا"
    en: "Mango Chia Pudding"
    cuisine: "عالمي"
    servings: 2
    time: 10
    photo:
      dish: "mango chia pudding in two glasses: grey-speckled chia pudding layer, bright orange mango puree layer and fresh mango cubes on top"
      vessel: "two clear glasses on a dark slate board"
      angle: "eye-level side view"
    ingredients:
      - [chia, 30, "٣ معالق كبيرة"]
      - [milk_skim, 250, "كوب"]
      - [mango, 150, "مانجاية صغيرة"]
      - [honey, 10, "٢ معلقة صغيرة"]
      - [vanilla, 2, "قطرات"]
    steps:
      - "اخلط الشيا واللبن والعسل والفانيليا جيداً، واتركها ١٠ دقائق ثم قلّب مرة أخرى."
      - "غطِّها واتركها في الثلاجة ٤ ساعات على الأقل حتى تتماسك."
      - "اهرس نصف المانجا، وقطّع الباقي مكعبات."
      - "وزّع البودينج في كوبين، ثم ضع المانجا المهروسة والمكعبات فوقه."
    tip: "الشيا تمتص حتى ١٠ أضعاف وزنها من السائل — وغنية بالألياف التي تزيد الإحساس بالشبع."

  - id: d02
    name: "أم علي الصحية"
    en: "Lighter Om Ali"
    cuisine: "مصري"
    servings: 4
    time: 30
    photo:
      dish: "lighter Egyptian om ali: golden-browned bread-and-milk pudding with raisins, coconut, almonds and pistachios on top, dusted with cinnamon"
      vessel: "a dark clay baking dish"
      angle: "45-degree angle"
    ingredients:
      - [bread_whole, 100, "٤ شرائح توست أسمر"]
      - [milk_skim, 500, "٢ كوب"]
      - [raisins, 20, "معلقة كبيرة ونصف"]
      - [coconut_dried, 10, "معلقة كبيرة"]
      - [almonds, 20, "١٥ حبة"]
      - [pistachios, 10, "حفنة صغيرة"]
      - [honey, 20, "معلقة كبيرة"]
      - [vanilla, 3, "قطرات"]
      - [cinnamon, 1, "رشة"]
    steps:
      - "حمّص التوست في الفرن حتى يجف ويقرمش، ثم كسّره قطعاً في طاجن."
      - "وزّع الزبيب وجوز الهند ونصف المكسرات فوق العيش."
      - "سخّن اللبن مع العسل والفانيليا حتى يقارب الغليان، وصبه فوق الطاجن."
      - "رش باقي المكسرات والقرفة، واخبزه في فرن ٢٠٠° (شواية) ١٠ دقائق حتى يتحمر الوش."
    tip: "التوست الأسمر المحمص بديل لطيف للرقاق أو البف باستري، ويوفر الكثير من الدهون."

  - id: d03
    name: "مافن الموز والشوفان بدون سكر مضاف"
    en: "No-Added-Sugar Banana Oat Muffins"
    cuisine: "عالمي"
    servings: 8
    time: 35
    photo:
      dish: "banana oat muffins with dark chocolate chunks on top, one split open to show the moist interior"
      vessel: "dark parchment cases on a black wire rack"
      angle: "45-degree angle"
    ingredients:
      - [banana, 240, "٢ موزة كبيرة ناضجة جداً"]
      - [oats, 160, "كوبين إلا ربع"]
      - [egg, 100, "٢ بيضة"]
      - [greek_yogurt_0, 100, "نصف علبة"]
      - [baking_powder, 6, "معلقة صغيرة ونصف"]
      - [cinnamon, 3, "معلقة صغيرة"]
      - [vanilla, 5, "معلقة صغيرة"]
      - [dark_chocolate, 30, "قطع شوكولاتة داكنة"]
    steps:
      - "سخّن الفرن على ١٨٠°، وجهّز صينية مافن بـ ٨ أكواب ورق."
      - "اطحن الشوفان في الكبة حتى يصبح دقيقاً."
      - "اهرس الموز، واخفقه مع البيض والزبادي والفانيليا."
      - "أضف دقيق الشوفان والبيكنج باودر والقرفة، وقلّب حتى يتجانس فقط، ثم أضف نصف الشوكولاتة."
      - "وزّع الخليط على الأكواب، ورش باقي الشوكولاتة، واخبزه ٢٠–٢٢ دقيقة."
    tip: "كلما كان الموز أنضج (قشرته منقطة بالأسود) كان المافن أحلى بدون أي سكر."

  - id: d04
    name: "آيس كريم الموز بالكاكاو"
    en: "Chocolate Banana Nice-Cream"
    cuisine: "عالمي"
    servings: 2
    time: 5
    photo:
      dish: "two scoops of homemade chocolate banana nice-cream, uniformly light cocoa-brown soft-serve texture (blended frozen banana, cocoa and peanut butter), a few banana slices beside the bowl"
      vessel: "a dark ceramic bowl"
      angle: "45-degree angle"
    ingredients:
      - [banana, 240, "٢ موزة مقطعة ومجمدة"]
      - [cocoa, 10, "معلقة كبيرة"]
      - [peanut_butter, 15, "معلقة كبيرة"]
      - [milk_skim, 40, "معلقتين أو ثلاثة"]
    steps:
      - "قطّع الموز شرائح، وجمّده في كيس ٤ ساعات على الأقل."
      - "ضع الموز المجمد في الكبة مع الكاكاو وزبدة الفول السوداني."
      - "اطحنه مع إضافة اللبن تدريجياً وكشط الجوانب حتى يصبح قوامه مثل الآيس كريم."
      - "قدّمه فوراً، أو جمّده ٣٠ دقيقة لقوام أكثر تماسكاً."
    tip: "احتفظ دائماً بالموز الناضج الزائد في الفريزر — ليكون جاهزاً لأي آيس كريم أو سموزي."

  - id: d05
    name: "بسبوسة صحية بالزبادي والشوفان"
    en: "Healthy Yogurt Oat Basbousa"
    cuisine: "مصري"
    servings: 12
    time: 45
    photo:
      dish: "golden diamond-cut healthy basbousa squares made with oats and yogurt, each topped with a blanched almond, glistening with a light honey syrup"
      vessel: "a rectangular dark metal baking tray"
      angle: "45-degree angle"
    ingredients:
      - [oats, 150, "مطحون ناعم"]
      - [greek_yogurt_0, 200, "علبة كبيرة"]
      - [egg, 100, "٢ بيضة"]
      - [coconut_dried, 30, "٣ معالق كبيرة"]
      - [honey, 60, "٣ معالق كبيرة (نصفها للتشريب)"]
      - [baking_powder, 6, "معلقة صغيرة ونصف"]
      - [vanilla, 4, "معلقة صغيرة"]
      - [almonds, 12, "١٢ حبة للتزيين"]
    steps:
      - "سخّن الفرن على ١٨٠°. اخلط الشوفان المطحون وجوز الهند والبيكنج باودر."
      - "اخفق الزبادي والبيض ونصف العسل والفانيليا، واخلطها مع المكونات الجافة."
      - "افرد الخليط في صينية مبطنة، وقطّعه معينات، وضع لوزة في كل قطعة."
      - "اخبزها ٢٥ دقيقة حتى يتحمر الوش، ثم ادهنها بباقي العسل المخفف بمعلقة ماء ساخن."
    tip: "البسبوسة التقليدية بالسكر والسمن = ~٢٥٠ سعر للقطعة؛ هذه النسخة أقل من النصف."

  - id: d06
    name: "مهلبية خفيفة بالفستق"
    en: "Light Muhallabia with Pistachios"
    cuisine: "عربي"
    servings: 4
    time: 15
    photo:
      dish: "four small cups of smooth white muhallabia milk pudding topped with chopped green pistachios and a pinch of cinnamon"
      vessel: "four small clear glass cups on a dark tray"
      angle: "45-degree angle"
    ingredients:
      - [milk_skim, 600, "٢ كوب ونصف"]
      - [cornstarch, 40, "٤ معالق كبيرة"]
      - [honey, 40, "٢ معلقة كبيرة"]
      - [vanilla, 3, "قطرات"]
      - [pistachios, 15, "مفروم"]
      - [cinnamon, 0, "رشة"]
    steps:
      - "ذوّب النشا في كوب لبن بارد."
      - "سخّن باقي اللبن مع العسل، ثم أضف خليط النشا مع التقليب المستمر حتى يتكثف ويغلي."
      - "أضف الفانيليا، وصبه في ٤ أكواب، واتركه يبرد ثم في الثلاجة ساعتين."
      - "زيّنه بالفستق والقرفة."
    tip: "اللبن الخالي الدسم يعطي نفس القوام مع النشا بسعرات أقل بكثير."

  - id: d07
    name: "رز بلبن صحي"
    en: "Lighter Egyptian Rice Pudding"
    cuisine: "مصري"
    servings: 4
    time: 45
    photo:
      dish: "creamy Egyptian rice pudding (roz bel laban) in small bowls, with a light golden baked top, sprinkled with cinnamon and a few raisins"
      vessel: "small dark clay bowls (sobia-style)"
      angle: "45-degree angle"
    ingredients:
      - [rice_white, 60, "ربع كوب ونصف"]
      - [milk_skim, 700, "٣ أكواب"]
      - [honey, 40, "٢ معلقة كبيرة"]
      - [vanilla, 3, "قطرات"]
      - [raisins, 20, "معلقة كبيرة ونصف"]
      - [cinnamon, 0, "رشة"]
    steps:
      - "اسلق الرز في كوب ماء ١٠ دقائق حتى يتشربه."
      - "أضف اللبن، واتركه على نار هادئة ٣٠ دقيقة مع التقليب حتى يتكثف."
      - "أضف العسل والفانيليا والزبيب، وصبه في أطباق."
      - "يمكن تحميره تحت الشواية ٥ دقائق، ويُقدّم بارداً بالقرفة."
    tip: "التقليب المستمر في آخر ١٠ دقائق يمنع الالتصاق ويعطي القوام الكريمي."

  - id: d08
    name: "براونيز الفاصوليا السوداء"
    en: "Black Bean Brownies"
    cuisine: "أمريكي"
    servings: 12
    time: 40
    photo:
      dish: "twelve fudgy dark chocolate brownies made with black beans, cut into squares, with melting dark chocolate chunks on top"
      vessel: "a square black baking pan and parchment"
      angle: "45-degree angle"
    ingredients:
      - [black_beans_canned, 240, "علبة صغيرة مصفاة ومغسولة"]
      - [cocoa, 30, "٣ معالق كبيرة"]
      - [egg, 100, "٢ بيضة"]
      - [honey, 60, "٣ معالق كبيرة"]
      - [oats, 40, "نصف كوب"]
      - [dark_chocolate, 30, "قطع"]
      - [baking_powder, 4, "معلقة صغيرة"]
      - [vanilla, 4, "معلقة صغيرة"]
    steps:
      - "سخّن الفرن على ١٨٠° وبطّن قالباً مربعاً ٢٠ سم."
      - "اضرب كل المكونات ما عدا الشوكولاتة في الكبة حتى تصبح ناعمة تماماً."
      - "صبها في القالب، ورش الشوكولاتة."
      - "اخبزها ٢٢–٢٥ دقيقة، واتركها تبرد تماماً قبل التقطيع ١٢ مربعاً."
    tip: "لن يلاحظ أحد الفاصوليا — لكنها تضيف بروتيناً وأليافاً وقواماً لزجاً رائعاً."

  - id: d09
    name: "بانا كوتا الزبادي بالفراولة"
    en: "Yogurt Panna Cotta with Strawberries"
    cuisine: "إيطالي"
    servings: 4
    time: 20
    photo:
      dish: "four creamy white yogurt panna cottas unmolded on plates, topped with a bright red strawberry compote and fresh strawberry halves, mint leaf"
      vessel: "small black dessert plates"
      angle: "45-degree angle"
    ingredients:
      - [greek_yogurt_0, 300, "علبتين"]
      - [milk_skim, 200, "كوب إلا ربع"]
      - [gelatin, 8, "ظرف جيلاتين"]
      - [honey, 30, "معلقة كبيرة ونصف"]
      - [vanilla, 3, "قطرات"]
      - [strawberries, 150, "للتزيين والصوص"]
    steps:
      - "انثر الجيلاتين على ٣ معالق ماء بارد واتركه ٥ دقائق."
      - "سخّن اللبن مع العسل (بدون غليان)، وذوّب فيه الجيلاتين."
      - "اخلطه مع الزبادي والفانيليا، وصبه في ٤ قوالب، وضعه في الثلاجة ٤ ساعات."
      - "اهرس نصف الفراولة كصوص، وقدّم البانا كوتا معها ومع باقي الفراولة."
    tip: "الزبادي بدل الكريمة يقلل السعرات للثلث ويضاعف البروتين."

  - id: d10
    name: "تفاح مشوي بالقرفة والمكسرات"
    en: "Baked Cinnamon Apples"
    cuisine: "عالمي"
    servings: 4
    time: 40
    photo:
      dish: "four whole baked cored apples, soft and caramelised, filled with a cinnamon oat-walnut crumble, a spoon of Greek yogurt beside each"
      vessel: "a dark cast-iron baking dish"
      angle: "45-degree angle"
    ingredients:
      - [apple, 600, "٤ تفاحات"]
      - [walnuts, 30, "مفروم"]
      - [oats, 20, "معلقتين كبيرتين"]
      - [honey, 20, "معلقة كبيرة"]
      - [cinnamon, 3, "معلقة صغيرة ونصف"]
      - [greek_yogurt_0, 120, "للتقديم"]
    steps:
      - "سخّن الفرن على ١٨٠°. انزع قلب التفاح من أعلى بدون أن تخرق القاع."
      - "اخلط عين الجمل والشوفان والعسل والقرفة، واحشُ التفاح."
      - "ضعه في طبق مع ربع كوب ماء، واخبزه ٣٠ دقيقة حتى يطرى."
      - "قدّمه دافئاً مع معلقة زبادي."
    tip: "رائحة القرفة والتفاح في الفرن تعطي إحساس الحلوى بدون سكر مضاف تقريباً."

  - id: d11
    name: "موس الشوكولاتة بالأفوكادو (كيتو)"
    en: "Keto Avocado Chocolate Mousse"
    cuisine: "عالمي"
    servings: 4
    time: 10
    photo:
      dish: "four small glasses of silky dark chocolate avocado mousse topped with raspberries and cacao shavings"
      vessel: "four small clear glasses on a black marble slab"
      angle: "45-degree angle"
    ingredients:
      - [avocado, 300, "٢ أفوكادو ناضج"]
      - [cocoa, 30, "٣ معالق كبيرة"]
      - [stevia, 20, "حسب الرغبة"]
      - [almond_milk, 80, "ثلث كوب"]
      - [vanilla, 3, "قطرات"]
      - [raspberries, 40, "للتزيين"]
    steps:
      - "ضع الأفوكادو والكاكاو والمحلي ولبن اللوز والفانيليا في الخلاط."
      - "اضربه حتى يصبح ناعماً تماماً بلا أي قطع."
      - "وزّعه في ٤ أكواب، وبرّده ساعة، وزيّنه بالتوت."
    tip: "الأفوكادو الناضج جداً هو سر القوام الحريري — ولن يظهر طعمه أبداً."

  - id: d12
    name: "كوكيز الموز والشوفان"
    en: "Banana Oat Cookies"
    cuisine: "عالمي"
    servings: 6
    time: 25
    photo:
      dish: "twelve rustic chewy banana oat cookies with raisins and walnut pieces cooling on a dark wire rack"
      vessel: "a black wire cooling rack"
      angle: "45-degree angle"
    ingredients:
      - [banana, 200, "٢ موزة ناضجة جداً"]
      - [oats, 140, "كوب وثلاثة أرباع"]
      - [raisins, 30, "معلقتين كبيرتين"]
      - [walnuts, 20, "مفروم"]
      - [cinnamon, 2, "معلقة صغيرة"]
    steps:
      - "سخّن الفرن على ١٨٠°. اهرس الموز جيداً."
      - "اخلطه مع الشوفان والزبيب وعين الجمل والقرفة، واتركه ٥ دقائق."
      - "شكّل ١٢ قرصاً على صينية مبطنة."
      - "اخبزها ١٥ دقيقة حتى تتماسك وتتحمر الأطراف."
    tip: "الحصة = قطعتين. بدون دقيق أو سكر أو زبدة."

  - id: d13
    name: "كريب الشوفان بالفراولة والزبادي"
    en: "Oat Crepes with Strawberries"
    cuisine: "فرنسي"
    servings: 3
    time: 25
    photo:
      dish: "thin golden oat crepes folded into triangles, filled with Greek yogurt and fresh sliced strawberries, a light drizzle of honey"
      vessel: "a long black rectangular dessert plate"
      angle: "45-degree angle"
    ingredients:
      - [oats, 60, "مطحون ناعم"]
      - [egg, 100, "٢ بيضة"]
      - [milk_skim, 150, "ثلثا كوب"]
      - [strawberries, 150, "شرائح"]
      - [greek_yogurt_0, 100, "نصف علبة"]
      - [honey, 10, "معلقتين صغيرتين"]
      - [butter, 3, "لدهن الطاسة"]
    steps:
      - "اضرب الشوفان والبيض واللبن في الخلاط حتى يصبح خليطاً سائلاً ناعماً، واتركه ١٠ دقائق."
      - "سخّن طاسة غير لاصقة وادهنها بطبقة رقيقة جداً من الزبدة."
      - "صب كمية قليلة ولف الطاسة لتغطية القاع، واتركها دقيقة ثم اقلبها ٣٠ ثانية."
      - "احشها بالزبادي والفراولة، واطوها، ورش العسل."
    tip: "يخرج من الخليط ٦ كريب — الحصة = ٢."

