chapter:
  id: desserts
  title: "الحلويات الصحية"
  en: "Healthy Desserts"
  kind: dessert
  color: "#b8456f"
  intro: "أم علي وبودينج ومافن وآيس كريم — حلويات تشبع رغبتك في السكر بسعرات محسوبة، أغلبها ٢٠٠ سعر أو أقل."

recipes:
  - id: d00
    name: "تشيز كيك صحي بالتوت"
    en: "Healthy Berry Cheesecake"
    cuisine: "عالمي"
    servings: 8
    time: 70
    ingredients:
      - [almond_flour, 200, "كوبين"]
      - [butter, 80, "غير مملحة، مذابة"]
      - [stevia, 60, "بدون سعرات"]
      - [cream_cheese_light, 400, "بدرجة حرارة الغرفة"]
      - [greek_yogurt_0, 200, "علبة كبيرة"]
      - [egg, 100, "٢ بيضة"]
      - [vanilla, 4, "معلقة صغيرة"]
      - [lemon_zest, 2, "معلقة صغيرة"]
      - [strawberries, 80, "للتزيين"]
      - [blueberries, 70, "للتزيين"]
    steps:
      - "سخّن الفرن على ١٦٠°. اخلط دقيق اللوز مع الزبدة المذابة و٢٠ جم من المحلي، واضغطه جيداً في قاع قالب ٢٠–٢٢ سم، واخبزه ١٠ دقائق."
      - "اخفق الجبنة الكريمية مع الزبادي وباقي المحلي والفانيليا وقشر الليمون حتى يصبح القوام ناعماً تماماً."
      - "أضف البيض واحدة تلو الأخرى، واخلط على سرعة منخفضة فقط حتى يختفي — الخفق الزائد يسبب التشقق."
      - "صب الخليط فوق القاعدة، ووازن السطح، واخبزه ٤٥–٥٠ دقيقة حتى تتماسك الأطراف ويبقى المنتصف يهتز قليلاً."
      - "أطفئ الفرن واترك التشيز كيك بداخله والباب موارب ساعة، ثم في الثلاجة ٤ ساعات على الأقل."
      - "زيّنها بالتوت الطازج وقطّعها ٨ قطع."
    tip: "استخدم جبنة كريمية قليلة الدسم، ويمكن استبدال الزبادي بزبادي نباتي. تُحفظ في الثلاجة حتى ٥ أيام."
    swap: "**لسعرات أقل:** قاعدة رفيعة من ١٠٠ جم دقيق لوز و٤٠ جم زبدة (حوالي −١١٠ سعر للقطعة). **بدون جلوتين:** الوصفة خالية من الدقيق الأبيض — تأكد أن المحلي والفانيليا خاليان من الجلوتين."

  - id: d01
    name: "بودينج الشيا بالمانجا"
    en: "Mango Chia Pudding"
    cuisine: "عالمي"
    servings: 2
    time: 10
    ingredients:
      - [chia, 30, "٣ معالق كبيرة"]
      - [milk_skim, 250, "كوب"]
      - [mango, 150, "مانجاية صغيرة"]
      - [honey, 10, "٢ معلقة صغيرة"]
      - [vanilla, 2, "قطرات"]
    steps:
      - "اخلط الشيا واللبن والعسل والفانيليا جيداً، واتركها ١٠ دقائق ثم قلّب مرة أخرى."
      - "غطِّها واتركها في الثلاجة ٤ ساعات على الأقل حتى تتماسك."
      - "اهرس نصف المانجا، وقطّع الباقي مكعبات."
      - "وزّع البودينج في كوبين، ثم ضع المانجا المهروسة والمكعبات فوقه."
    tip: "الشيا تمتص حتى ١٠ أضعاف وزنها من السائل — وغنية بالألياف التي تزيد الإحساس بالشبع."

  - id: d02
    name: "أم علي الصحية"
    en: "Lighter Om Ali"
    cuisine: "مصري"
    servings: 4
    time: 30
    ingredients:
      - [bread_whole, 100, "٤ شرائح توست أسمر"]
      - [milk_skim, 500, "٢ كوب"]
      - [raisins, 20, "معلقة كبيرة ونصف"]
      - [coconut_dried, 10, "معلقة كبيرة"]
      - [almonds, 20, "١٥ حبة"]
      - [pistachios, 10, "حفنة صغيرة"]
      - [honey, 20, "معلقة كبيرة"]
      - [vanilla, 3, "قطرات"]
      - [cinnamon, 1, "رشة"]
    steps:
      - "حمّص التوست في الفرن حتى يجف ويقرمش، ثم كسّره قطعاً في طاجن."
      - "وزّع الزبيب وجوز الهند ونصف المكسرات فوق العيش."
      - "سخّن اللبن مع العسل والفانيليا حتى يقارب الغليان، وصبه فوق الطاجن."
      - "رش باقي المكسرات والقرفة، واخبزه في فرن ٢٠٠° (شواية) ١٠ دقائق حتى يتحمر الوش."
    tip: "التوست الأسمر المحمص بديل لطيف للرقاق أو البف باستري، ويوفر الكثير من الدهون."

  - id: d03
    name: "مافن الموز والشوفان بدون سكر مضاف"
    en: "No-Added-Sugar Banana Oat Muffins"
    cuisine: "عالمي"
    servings: 8
    time: 35
    ingredients:
      - [banana, 240, "٢ موزة كبيرة ناضجة جداً"]
      - [oats, 160, "كوبين إلا ربع"]
      - [egg, 100, "٢ بيضة"]
      - [greek_yogurt_0, 100, "نصف علبة"]
      - [baking_powder, 6, "معلقة صغيرة ونصف"]
      - [cinnamon, 3, "معلقة صغيرة"]
      - [vanilla, 5, "معلقة صغيرة"]
      - [dark_chocolate, 30, "قطع شوكولاتة داكنة"]
    steps:
      - "سخّن الفرن على ١٨٠°، وجهّز صينية مافن بـ ٨ أكواب ورق."
      - "اطحن الشوفان في الكبة حتى يصبح دقيقاً."
      - "اهرس الموز، واخفقه مع البيض والزبادي والفانيليا."
      - "أضف دقيق الشوفان والبيكنج باودر والقرفة، وقلّب حتى يتجانس فقط، ثم أضف نصف الشوكولاتة."
      - "وزّع الخليط على الأكواب، ورش باقي الشوكولاتة، واخبزه ٢٠–٢٢ دقيقة."
    tip: "كلما كان الموز أنضج (قشرته منقطة بالأسود) كان المافن أحلى بدون أي سكر."

  - id: d04
    name: "آيس كريم الموز بالكاكاو"
    en: "Chocolate Banana Nice-Cream"
    cuisine: "عالمي"
    servings: 2
    time: 5
    ingredients:
      - [banana, 240, "٢ موزة مقطعة ومجمدة"]
      - [cocoa, 10, "معلقة كبيرة"]
      - [peanut_butter, 15, "معلقة كبيرة"]
      - [milk_skim, 40, "معلقتين أو ثلاثة"]
    steps:
      - "قطّع الموز شرائح، وجمّده في كيس ٤ ساعات على الأقل."
      - "ضع الموز المجمد في الكبة مع الكاكاو وزبدة الفول السوداني."
      - "اطحنه مع إضافة اللبن تدريجياً وكشط الجوانب حتى يصبح قوامه مثل الآيس كريم."
      - "قدّمه فوراً، أو جمّده ٣٠ دقيقة لقوام أكثر تماسكاً."
    tip: "احتفظ دائماً بالموز الناضج الزائد في الفريزر — ليكون جاهزاً لأي آيس كريم أو سموزي."
