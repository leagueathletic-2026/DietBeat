    cuisine: "آسيوي"
    servings: 3
    time: 25
    photo:
      dish: "golden crispy tofu cubes stir-fried with broccoli florets, red bell pepper and carrot slices in a glossy soy-ginger sauce, sesame seeds"
      vessel: "a black wok"
      angle: "overhead top-down view"
    ingredients:
      - [tofu, 400, "مكعبات"]
      - [broccoli, 200, "زهرات"]
      - [bell_pepper_red, 100, "شرائح"]
      - [carrot, 80, "شرائح رفيعة"]
      - [soy_sauce_light, 20, "معلقة كبيرة ونصف"]
      - [ginger, 6, "مبشور"]
      - [garlic, 6, "فصين"]
      - [cornstarch, 5, "معلقتين صغيرتين"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [sesame, 5, "للتزيين"]
    steps:
      - "جفف التوفو بفوطة جيداً، وقلّبه في النشا."
      - "حمّره في الزيت على نار عالية ٨ دقائق حتى يقرمش من كل الجهات، ثم ارفعه."
      - "شوّح الخضار مع الثوم والجنزبيل ٤ دقائق."
      - "أرجع التوفو، وأضف الصويا صوص، وقلّب، ورش السمسم."
    tip: "التوفو بروتين نباتي كامل — والتجفيف الجيد سر قرمشته."

  - id: v10
    name: "فلفل محشي بالكينوا والفاصوليا"
