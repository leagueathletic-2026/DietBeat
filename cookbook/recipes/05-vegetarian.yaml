chapter:
  id: vegetarian
  title: "النباتي والبقوليات"
  en: "Vegetarian & Legumes"
  kind: main
  color: "#5b8a2a"
  intro: "كشري وطعمية ومسقعة وكاري — أطباق نباتية غنية بالألياف والبروتين النباتي، ومُشبعة لأطول وقت."

recipes:
  - id: v01
    name: "كشري صحي بالعدس والرز البني"
    en: "Healthier Koshari"
    cuisine: "مصري"
    servings: 4
    time: 60
    photo:
      dish: "healthy Egyptian koshari: brown rice and lentils, small whole-wheat macaroni, chickpeas, red tomato sauce on top and crispy golden baked onions"
      vessel: "a deep black ceramic bowl"
      angle: "45-degree angle"
    ingredients:
      - [lentils_brown, 150, "كوب إلا ربع عدس بجبة"]
      - [rice_brown, 150, "كوب إلا ربع"]
      - [pasta_whole, 100, "مكرونة قمح كامل صغيرة"]
      - [chickpeas_canned, 200, "نصف علبة حمص مصفى"]
      - [onion, 300, "٣ بصلات متوسطة"]
      - [olive_oil, 20, "معلقة كبيرة ونصف"]
      - [tomato_canned, 400, "علبة طماطم مقطعة"]
      - [tomato_paste, 30, "٢ معلقة كبيرة"]
      - [garlic, 15, "٥ فصوص"]
      - [vinegar, 20, "معلقة كبيرة ونصف"]
      - [cumin, 3, "معلقة صغيرة ونصف"]
      - [chili_green, 0, "شطة حسب الرغبة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "قطّع البصل شرائح رفيعة، وقلّبه مع نصف الزيت، وافرده في صينية واخبزه في فرن ٢٠٠° لمدة ٢٥–٣٠ دقيقة مع التقليب حتى يتحمر ويقرمش."
      - "اسلق العدس ١٥ دقيقة، ثم أضف الرز البني والكمون والملح وماء يغطيهم بـ ٢ سم، واتركهم على نار هادئة ٢٥–٣٠ دقيقة حتى ينضجا."
      - "اسلق المكرونة حسب تعليمات العبوة."
      - "للصلصة: شوّح الثوم في باقي الزيت، وأضف الطماطم والصلصة والملح، واتركها ١٠ دقائق، ثم أضف الخل."
      - "قدّم الرز بالعدس، ثم المكرونة، ثم الحمص والصلصة، وزيّن بالبصل المحمر."
    tip: "تحمير البصل في الفرن بدلاً من القلي العميق يوفر مئات السعرات ويعطي نفس القرمشة تقريباً."
    swap: "**لسعرات أقل:** زوّد الصلصة والبصل وقلّل المكرونة إلى ٥٠ جم."

  - id: v02
    name: "طعمية في الفرن مع صوص الطحينة"
    en: "Oven-Baked Falafel (Ta'ameya)"
    cuisine: "مصري"
    servings: 3
    time: 40
    photo:
      dish: "about ten crispy oven-baked green Egyptian falafel (ta'ameya) discs coated with sesame seeds, one broken open to show the bright green herb interior, a small bowl of tahini sauce"
      vessel: "a dark slate board"
      angle: "45-degree angle"
    ingredients:
      - [fava_dry, 200, "فول مدشوش منقوع ليلة (الوزن جاف)"]
      - [parsley, 30, "حزمة صغيرة"]
      - [cilantro, 30, "حزمة صغيرة"]
      - [dill, 15, "قليل من الشبت"]
      - [green_onion, 30, "عودين بصل أخضر"]
      - [onion, 60, "نصف بصلة"]
      - [garlic, 10, "٣ فصوص"]
      - [cumin, 3, "معلقة صغيرة ونصف"]
      - [baking_powder, 3, "نصف معلقة صغيرة"]
      - [sesame, 10, "معلقة كبيرة"]
      - [olive_oil, 15, "معلقة كبيرة (للدهن)"]
      - [tahini, 30, "٢ معلقة كبيرة"]
      - [lemon_juice, 20, "معلقة كبيرة ونصف"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "انقع الفول في ماء ١٢ ساعة على الأقل، ثم صفّه جيداً وجففه."
      - "اطحن الفول مع الخضرة والبصل والثوم والكمون والملح في الكبة أو الخلاط حتى يصبح عجينة متماسكة ناعمة."
      - "أضف البيكنج باودر قبل التشكيل مباشرة، وشكّل أقراصاً صغيرة (حوالي ١٥ قرص)، ورش عليها السمسم."
      - "ادهن صينية بنصف الزيت، ورص الأقراص، وادهن وجهها بالباقي. اخبزها في فرن ٢٢٠° لمدة ١٢ دقيقة، ثم اقلبها و١٠ دقائق أخرى."
      - "اخفق الطحينة مع الليمون والملح والماء حتى تصبح صوصاً، وقدّمها مع الطعمية."
    tip: "لا تستخدم فولاً مسلوقاً أبداً في الطعمية — الفول المنقوع النيء هو سر التماسك."
    swap: "**كساندوتش:** ٣ أقراص في نصف رغيف عيش أسمر (٣٠ جم، +٧٨ سعر) مع سلطة."

  - id: v03
    name: "مسقعة صحية في الفرن"
    en: "Oven-Baked Egyptian Moussaka"
    cuisine: "مصري"
    servings: 3
    time: 55
    photo:
      dish: "Egyptian oven-baked moussaka: roasted eggplant slices layered with tomato, green pepper and onion sauce, bubbling and caramelised"
      vessel: "a dark clay baking dish"
      angle: "overhead top-down view"
    ingredients:
      - [eggplant, 600, "٢ باذنجانة كبيرة"]
      - [tomato_canned, 400, "علبة طماطم مقطعة"]
      - [bell_pepper_green, 150, "فلفلتين"]
      - [onion, 100, "بصلة متوسطة"]
      - [garlic, 10, "٣ فصوص"]
      - [chili_green, 10, "فلفلة حارة (اختياري)"]
      - [olive_oil, 15, "معلقة كبيرة"]
      - [cumin, 1, "نصف معلقة صغيرة"]
      - [vinegar, 10, "معلقتين صغيرتين"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "قطّع الباذنجان شرائح سميكة، ورش عليها ملحاً واتركها ٢٠ دقيقة ثم جففها."
      - "ادهن الشرائح بثلثي الزيت بالفرشاة، واشوِها في فرن ٢٢٠° لمدة ٢٠ دقيقة حتى تتحمر."
      - "شوّح البصل والفلفل والحار في باقي الزيت، ثم أضف الثوم والطماطم والكمون والملح، واتركها ١٠ دقائق، ثم أضف الخل."
      - "رص الباذنجان في طاجن، وصب فوقه الصلصة، واخبزه ١٥ دقيقة."
    tip: "الباذنجان المقلي يشرب الزيت كالإسفنجة — الشوي بالفرشاة يوفر أكثر من ٣٠٠ سعر في الصينية."
    swap: "**لبروتين أعلى:** أضف ٢٠٠ جم لحمة مفرومة قليلة الدهن للصلصة (+٩٠ سعر و+١٤ جم بروتين للحصة)."

  - id: v04
    name: "كاري الحمص بالسبانخ"
    en: "Chickpea & Spinach Curry"
    cuisine: "هندي"
    servings: 3
    time: 30
    photo:
      dish: "chickpea and spinach curry in a turmeric-tomato sauce with a dollop of Greek yogurt on top"
      vessel: "a black ceramic bowl"
      angle: "45-degree angle"
    ingredients:
      - [chickpeas_canned, 400, "علبة حمص مصفاة"]
      - [spinach, 200, "كيس سبانخ"]
      - [tomato_canned, 400, "علبة طماطم مقطعة"]
      - [onion, 100, "بصلة متوسطة"]
      - [garlic, 10, "٣ فصوص"]
      - [ginger, 10, "قطعة مبشورة"]
      - [turmeric, 2, "معلقة صغيرة"]
      - [cumin, 2, "معلقة صغيرة"]
      - [paprika, 2, "معلقة صغيرة"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [greek_yogurt_2, 60, "للتقديم"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "شوّح البصل في الزيت ٥ دقائق، ثم أضف الثوم والجنزبيل والبهارات وقلّب دقيقة."
      - "أضف الطماطم والحمص والملح، واتركها تغلي على نار هادئة ١٥ دقيقة."
      - "أضف السبانخ وقلّب حتى تذبل (٢–٣ دقائق)."
      - "قدّمه ساخناً مع معلقة زبادي يوناني فوق كل طبق."
    tip: "الكاري يتحسن طعمه في اليوم التالي — مثالي للتحضير المسبق (Meal Prep)."
    swap: "**نباتي صرف (فيجان):** استغنَ عن الزبادي. **لوجبة أكبر:** قدّمه مع ٥٠ جم رز بسمتي (قبل الطهي) للشخص (+١٨٠ سعر)."

  - id: v05
    name: "عدس بجبة بالخضار"
    en: "Egyptian Brown Lentil Stew"
    cuisine: "مصري"
    servings: 4
    time: 45
    photo:
      dish: "hearty Egyptian brown lentil stew with carrot and tomato pieces, a drizzle of olive oil and cumin, lemon wedge and fresh parsley"
      vessel: "a deep dark clay bowl"
      angle: "45-degree angle"
    ingredients:
      - [lentils_brown, 200, "كوب عدس بجبة"]
      - [onion, 100, "بصلة"]
      - [tomato, 150, "ثمرة كبيرة"]
      - [carrot, 100, "جزرة"]
      - [garlic, 10, "٣ فصوص"]
      - [cumin, 3, "معلقة صغيرة ونصف"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [lemon_juice, 20, "للتقديم"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "شوّح البصل والثوم في الزيت ٤ دقائق."
      - "أضف العدس المغسول والجزر والطماطم والكمون و١ لتر ماء."
      - "اتركه على نار هادئة ٣٥ دقيقة حتى ينضج العدس ويتكثف."
      - "قدّمه مع الليمون."
    tip: "العدس من أرخص مصادر البروتين النباتي والحديد — والليمون يساعد على امتصاص الحديد."

  - id: v06
    name: "بيصارة بالخضرة"
    en: "Egyptian Bessara"
    cuisine: "مصري"
    servings: 4
    time: 50
    photo:
      dish: "Egyptian bessara: a smooth thick vivid-green fava bean and herb puree topped with crispy golden fried onion rings and a drizzle of olive oil"
      vessel: "a shallow dark stoneware bowl"
      angle: "overhead top-down view"
    ingredients:
      - [fava_dry, 200, "فول مدشوش"]
      - [dill, 30, "حزمة صغيرة"]
      - [parsley, 30, "حزمة صغيرة"]
      - [cilantro, 30, "حزمة صغيرة"]
      - [garlic, 15, "٥ فصوص"]
      - [onion, 100, "للتقلية"]
      - [olive_oil, 15, "معلقة كبيرة"]
      - [cumin, 3, "معلقة صغيرة ونصف"]
      - [chili_green, 10, "فلفلة حارة"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "انقع الفول ساعتين، ثم اسلقه مع الثوم في ١ لتر ماء ٣٥ دقيقة حتى يهرس."
      - "أضف الخضرة والحار والكمون، واتركها ٥ دقائق، ثم اضربها بالخلاط حتى تصبح ناعمة."
      - "حمّر البصل شرائح رفيعة في الزيت حتى يقرمش."
      - "صب البيصارة في طبق، ووزّع البصل المحمر فوقها."
    tip: "تُقدّم ساخنة أو باردة، وتحفظ في الثلاجة ٣ أيام."

  - id: v07
    name: "برجر العدس والكينوا"
    en: "Lentil & Quinoa Burgers"
    cuisine: "عالمي"
    servings: 4
    time: 45
    photo:
      dish: "four crispy golden-brown lentil and quinoa patties with visible grains and grated carrot, a small bowl of yogurt dip and a few lettuce leaves"
      vessel: "a dark wooden serving board"
      angle: "45-degree angle"
    ingredients:
      - [lentils_red, 120, "عدس أحمر"]
      - [quinoa, 60, "كينوا"]
      - [onion, 60, "نصف بصلة"]
      - [carrot, 60, "جزرة صغيرة مبشورة"]
      - [garlic, 5, "فص"]
      - [cumin, 2, "معلقة صغيرة"]
      - [oats, 40, "نصف كوب"]
      - [egg, 50, "بيضة"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [greek_yogurt_0, 100, "للتقديم"]
      - [salt, 0, "حسب الرغبة"]
    steps:
      - "اسلق العدس والكينوا معاً في ٤٥٠ مل ماء ١٥ دقيقة حتى يتشرب الماء، واتركهما يبردان."
      - "اخلطهما مع البصل والجزر والثوم والكمون والشوفان والبيض والملح، واهرس جزئياً."
      - "شكّل ٤ أقراص، وضعها في الثلاجة ٢٠ دقيقة."
      - "حمّرها في الزيت ٤ دقائق لكل جانب، وقدّمها مع الزبادي."
    tip: "التبريد قبل الطهي ضروري لتماسك الأقراص."

  - id: v08
    name: "تشيلي نباتي بالفاصوليا"
    en: "Three-Bean Vegetable Chili"
    cuisine: "مكسيكي"
    servings: 4
    time: 40
    photo:
      dish: "a thick vegetarian chili with red kidney beans, black beans, sweet corn and diced peppers in a smoky tomato sauce, topped with avocado cubes and coriander"
      vessel: "a black cast-iron pot"
      angle: "45-degree angle"
    ingredients:
      - [kidney_canned, 240, "علبة صغيرة"]
      - [black_beans_canned, 240, "علبة صغيرة"]
      - [tomato_canned, 400, "علبة"]
      - [onion, 100, "بصلة"]
      - [bell_pepper_red, 150, "ثمرة"]
      - [corn, 100, "ذرة"]
      - [garlic, 10, "٣ فصوص"]
      - [cumin, 3, "معلقة صغيرة ونصف"]
      - [paprika, 3, "معلقة صغيرة ونصف"]
      - [olive_oil, 10, "٢ معلقة صغيرة"]
      - [avocado, 60, "للتقديم"]
      - [cilantro, 5, "للتزيين"]
    steps:
      - "شوّح البصل والفلفل في الزيت ٥ دقائق، ثم الثوم والبهارات دقيقة."
      - "أضف الطماطم والفاصوليا بنوعيها والذرة ونصف كوب ماء."
      - "اتركها تتسبك ٢٥ دقيقة على نار هادئة مع التقليب."
      - "قدّمها مع الأفوكادو والكزبرة."
    tip: "طبق غني جداً بالألياف — أكثر من نصف الاحتياج اليومي في حصة واحدة."

  - id: v09
