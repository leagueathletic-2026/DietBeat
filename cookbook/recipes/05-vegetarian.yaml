      vessel: "a dark ceramic baking dish"
      angle: "45-degree angle"
    ingredients:
      - [bell_pepper_red, 600, "٤ فلفل ألوان كبير"]
      - [quinoa, 120, "ثلثا كوب"]
      - [black_beans_canned, 240, "علبة صغيرة"]
      - [corn, 80, "ذرة"]
      - [tomato_canned, 200, "نصف علبة"]
      - [onion, 60, "نصف بصلة"]
      - [cumin, 2, "معلقة صغيرة"]
      - [mozzarella_light, 60, "مبشورة"]
      - [olive_oil, 5, "معلقة صغيرة"]
      - [cilantro, 5, "للتزيين"]
    steps:
      - "اطهِ الكينوا في ضعف حجمها ماء ١٥ دقيقة."
      - "شوّح البصل في الزيت، وأضف الطماطم والكمون، ثم الكينوا والفاصوليا والذرة."
      - "اقطع رأس الفلفل وأزل البذور، واحشه، ورصه في طبق مع قليل من الماء."
      - "غطِّه واخبزه في فرن ١٩٠° لمدة ٢٥ دقيقة، ثم رش الموتزاريلا واخبزه مكشوفاً ١٠ دقائق."
    tip: "الكينوا والفاصوليا معاً يعطيان كل الأحماض الأمينية الأساسية."

  - id: v11
