# Front-matter text for the book. Each entry in `pages` renders as one A4 page.
# Block types: p (paragraph), list (bullets), callout (highlighted box), tags (tag legend), evidence (cited points)
# Scientific claims must cite `references` by number. Every reference was verified on PubMed.

title: "مطبخ DietBeat"
subtitle: "١٥٠ وصفة صحية محسوبة السعرات والماكروز"
tracks: ["تخسيس", "بروتين عالي", "كيتو / لو كارب", "صحي متوازن"]
edition: "الإصدار الأول — ٢٠٢٦"

pages:
  - kicker: "قبل ما تبدأ"
    title: "أهلاً بك في مطبخ DietBeat"
    blocks:
      - p: "هذا الكتاب صُمّم ليجعل الأكل الصحي سهلاً ولذيذاً ومحسوباً بدقة. ستجد فيه ١٥٠ وصفة من المطبخ المصري والعربي والعالمي، كل وصفة منها محسوبة السعرات والبروتين والكربوهيدرات والدهون للحصة الواحدة."
      - p: "الكتاب مناسب لأكثر من هدف في نفس الوقت:"
      - list:
          - "**إذا كان هدفك التخسيس:** ابحث عن علامة «تخسيس» — وصفات مُشبعة وسعراتها محسوبة."
          - "**إذا كنت رياضياً أو تبني عضلاً:** علامة «بروتين عالي» تساعدك على الوصول لاحتياجك اليومي من البروتين."
          - "**إذا كنت تتبع نظام كيتو أو لو كارب:** علامة «كيتو» تعني كربوهيدرات صافية ١٠ جم أو أقل في الحصة."
          - "**إذا كنت تريد أكلاً صحياً ومتوازناً:** كل الوصفات مبنية على مكونات طبيعية وقليلة التصنيع."
      - callout: "ابدأ من الفهرس: كل وصفة مكتوب جنبها سعراتها وماكروزها وعلاماتها، فتستطيع أن تختار حسب هدفك في ثوانٍ."

  - kicker: "الدقة أولاً"
    title: "كيف حسبنا القيم الغذائية؟"
    blocks:
      - p: "كل رقم في هذا الكتاب محسوب — وليس تقديراً. حسبنا القيم لكل مكوّن على حدة بالجرام من قاعدة البيانات الرسمية لوزارة الزراعة الأمريكية **USDA FoodData Central (SR Legacy)**، ثم جمعناها وقسمناها على عدد الحصص."
      - list:
          - "**الأوزان المكتوبة للمكونات نيئة** (قبل الطبخ) وللجزء الذي يؤكل، إلا إذا ذُكر غير ذلك — مثل البقوليات المعلبة (مصفاة) أو التونة (مصفاة)."
          - "**كل القيم للحصة الواحدة.** عدد الحصص مكتوب أعلى كل وصفة."
          - "**الملح والبهارات المكتوبة «حسب الرغبة» غير محسوبة.** الصوديوم المذكور هو الموجود في المكونات نفسها فقط، فاحسبه إذا أضفت ملحاً."
          - "**الكربوهيدرات الصافية** = الكربوهيدرات الكلية − الألياف."
      - callout: "القيم تقريبية بطبيعتها: تختلف حسب الماركة وحجم الثمار وطريقة الطبخ. للحصول على أدق نتيجة استخدم ميزان مطبخ — فالفرق بين «معلقة زيت» بالعين وبالميزان قد يصل إلى عشرات السعرات."

  - kicker: "دليل سريع"
    title: "معنى العلامات على كل وصفة"
    blocks:
      - p: "العلامات تُحسب تلقائياً من أرقام الوصفة نفسها — وليست تقديراً شخصياً — بالقواعد التالية (للحصة الواحدة):"
      - tags: true
      - callout: "قد تحمل الوصفة الواحدة أكثر من علامة. مثلاً: صدور فراخ مشوية مع سلطة قد تكون «تخسيس» و«بروتين عالي» و«كيتو» في نفس الوقت."

  - kicker: "مبني على الأدلة"
    title: "ماذا يقول العلم — باختصار"
    blocks:
      - evidence:
          - h: "التخسيس يعتمد أساساً على عجز السعرات"
            text: "في تجربة عشوائية على ٨١١ شخص استمرت سنتين، أنظمة غذائية مختلفة في نسب الدهون والبروتين والكربوهيدرات أعطت نزول وزن متقارب، طالما السعرات منخفضة [1]. وفي تجربة DIETFITS على ٦٠٩ أشخاص، لم يكن هناك فرق ذو دلالة بين نظام قليل الدهون ونظام قليل الكربوهيدرات بعد ١٢ شهر [2]. الخلاصة: اختر الأسلوب الذي تستطيع الاستمرار عليه."
            refs: [1, 2]
          - h: "البروتين يساعد أثناء الدايت"
            text: "تحليل تجميعي لـ ٢٤ تجربة وجد أن الأنظمة منخفضة السعرات العالية في البروتين أعطت نزولاً أكبر قليلاً في الوزن والدهون، وحافظت بشكل أفضل على الكتلة العضلية مقارنة بالبروتين المعتاد [3]."
            refs: [3]
          - h: "احتياج الرياضيين من البروتين"
            text: "توصي الجمعية الدولية للتغذية الرياضية (ISSN) بـ ١٫٤–٢٫٠ جم بروتين لكل كجم من وزن الجسم يومياً لمعظم الرياضيين، مع ٢٠–٤٠ جم في الوجبة موزعة كل ٣–٤ ساعات [4]. وتحليل تجميعي لـ ٤٩ تجربة وجد أن مكاسب الكتلة العضلية مع تمارين المقاومة لم تزد بعد حوالي ١٫٦ جم/كجم/يوم [5]."
            refs: [4, 5]
          - h: "الكيتو: فعّال لكن الفرق صغير"
            text: "تحليل تجميعي لتجارب مدتها سنة أو أكثر وجد أن نظام الكيتو (٥٠ جم كربوهيدرات أو أقل يومياً) أعطى نزول وزن أكبر بحوالي ١ كجم فقط من النظام قليل الدهون [6]. ومراجعة شاملة حديثة وجدت دليلاً متوسط الجودة على نزول الوزن، لكن دليلاً عالي الجودة على ارتفاع الكوليسترول الضار LDL [7] — لذلك يُنصح بمتابعة التحاليل مع الطبيب."
            refs: [6, 7]
          - h: "الألياف والحبوب الكاملة"
            text: "سلسلة مراجعات منهجية وتحليلات تجميعية ربطت تناول ٢٥–٢٩ جم ألياف يومياً بأكبر انخفاض في خطر أمراض القلب والسكري من النوع الثاني وسرطان القولون، وأظهرت التجارب انخفاضاً في الوزن وضغط الدم والكوليسترول مع زيادة الألياف [8]. معظم الأدلة على الأمراض هنا من دراسات رصدية."
            refs: [8]

